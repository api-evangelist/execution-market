summary: >-
  Execution Market documents an HTTP webhook surface (HMAC-SHA256 signed, exponential-backoff retries, tiered
  subscription caps) managed through seven REST operations, plus a WebSocket event bus at wss://api.execution.market/ws,
  a proprietary A2A SSE stream (POST /a2a/v1/stream) and per-task meter SSE (GET /tasks/{task_id}/meter/stream). No
  AsyncAPI document is published on any host or in the docs; this artifact is the captured webhook catalog and NOT a
  generated AsyncAPI.
