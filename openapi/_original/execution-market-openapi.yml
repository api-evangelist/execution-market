      - Worker
      summary: Withdraw From Task
      description: The executor assigned to a task steps down before submitting. Any escrow locked for that executor is refunded to the payer first, then the task returns to 'published' so its publisher can assign someone else. If the refund cannot run, nothing changes.
      operationId: withdraw_from_task_api_v1_tasks__task_id__withdraw_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
