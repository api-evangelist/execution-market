    LifecycleOrderPayload:
      properties:
        action:
          type: string
          enum:
          - release
          - refundInEscrow
          title: Action
          default: release
        signer:
          type: string
          title: Signer
          description: Address that signed the order (0x…)
        deadline:
          type: integer
          title: Deadline
          description: Unix seconds; the Facilitator caps it at 900
        nonce:
          type: string
          title: Nonce
          description: bytes32 hex, one per order
        signature:
          type: string
          title: Signature
          description: EIP-712 signature (0x…)
      additionalProperties: false
      type: object
      required:
      - signer
      - deadline
      - nonce
      - signature
      title: LifecycleOrderPayload
      description: 'The EIP-712 escrow lifecycle order, signed by the PAYER.


        ``release`` moves money that is already deposited, so it carries no

        ERC-3009 authorization — this order is what answers *who may ask for the

        move*. The Facilitator accepts the payer (or the operator owner, which is

        EM''s treasury cold wallet and never signs), so on a release this is the

        publisher''s own signature, and EM only transports it.


        Get the exact typed data from

        ``GET /api/v1/escrow/task/{task_id}/lifecycle-challenge``. It expires in 10

        minutes: it authorizes ONE move, not a standing permission.'
    LifecycleOrderRequest:
      properties:
        action:
          type: string
          title: Action
          description: '''release'' o ''refundInEscrow'' — la accion que la orden autoriza'
          default: release
        signer:
          type: string
          title: Signer
          description: Direccion que firmo (0x…)
        deadline:
          type: integer
          title: Deadline
          description: Unix segundos; techo de 900 s
        nonce:
          type: string
          title: Nonce
          description: bytes32 en hex, uno por orden
        signature:
          type: string
          title: Signature
          description: Firma EIP-712 (0x…, 65 bytes)
      type: object
      required:
      - signer
      - deadline
      - nonce
      - signature
      title: LifecycleOrderRequest
      description: La orden EIP-712 firmada por el payer, tal como la devuelve el SDK.
    LinkENSRequest:
      properties:
        executor_id:
          type: string
          title: Executor Id
          description: UUID of the executor
      additionalProperties: false
      type: object
      required:
      - executor_id
      title: LinkENSRequest
      description: Link an existing ENS name to executor profile.
    LinkENSResponse:
      properties:
        linked:
          type: boolean
          title: Linked
