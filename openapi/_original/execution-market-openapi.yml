        effective_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Effective Reputation Score
          description: 'COALESCE(on-chain ERC-8004 aggregate, DB heuristic) — the score every min_reputation gate compares against, and what sort=reputation ranks on. Top-level (not only nested under seller_reputation) because this is the number a hiring decision cites: rank by it, and say so. NULL when the seller has never been rated; render that as ''no ratings yet'', never as 0.'
        has_reputation_history:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Reputation History
          description: 'Is the score above evidence at all? False = nobody has ever rated this seller and they have completed nothing, so effective_reputation_score is null BY DESIGN and the listing is still shown: a cold-start seller clears any min_reputation floor up to 50, exactly as the apply/assign gates allow. True = the score is earned, including an earned zero. Null = this response did not measure it (create/update replies), which is not the same as false.'
        onchain_reputation_score:
