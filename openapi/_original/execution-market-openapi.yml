  /api/v1/disputes/{dispute_id}/resolve:
    post:
      tags:
      - Disputes
      summary: Resolve Dispute
      description: "Submit a resolution verdict on a dispute.\n\nWho can call this (FIX-P1-08 — recusal + neutral-resolver enforcement):\n  1. A platform admin (``X-Admin-Key``) — neutral operator path, mirrors\n     migration-004 'Manually resolve dispute (admin)'.\n  2. An eligible, ASSIGNED human arbiter — ONLY when the feature flag\n     ``EM_ARBITER_UNILATERAL_RESOLUTION=true`` is set (OFF by default).\n\nA party to the dispute (publisher ``agent_id`` or the disputed\n``executor_id``) can NEVER resolve it — recusal is always enforced.\n\nVerdict options:\n  - 'release' -> worker wins, trigger Facilitator /settle\n  - 'refund'  -> agent wins, trigger Facilitator /refund\n  - 'split'   -> partial release + partial refund (requires split_pct)\n\nSide effects:\n  - Updates disputes row (status, winner, resolution_type='manual',\n    agent_refund_usdc, executor_payout_usdc)\n  - Triggers the appropriate payment flow\n  - Emits dispute.resolved event"
      operationId: resolve_dispute_api_v1_disputes__dispute_id__resolve_post
      parameters:
      - name: dispute_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Dispute Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveDisputeRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveDisputeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/arbiter/verify:
    post:
      tags:
      - Arbiter-as-a-Service
      summary: Verify Evidence
      description: "Run Ring 2 arbiter evaluation on arbitrary evidence.\n\nThis is the public Arbiter-as-a-Service endpoint. External marketplaces\ncan POST evidence payloads and receive a dual-inference verdict they\ncan use to drive their own payment flows.\n\nThe caller must provide either:\n  1. A pre-computed PHOTINT score in `photint_score` (if they ran\n     their own Ring 1), OR\n  2. Evidence that the arbiter's CHEAP tier can evaluate without\n     running LLM inference.\n\nTier is determined by bounty_usd:\n  - bounty < $1   -> CHEAP  ($0 cost)\n  - bounty < $10  -> STANDARD (~$0.001)\n  - bounty >= $10 -> MAX (~$0.003)\n\nCost cap: max 10% of bounty_usd.\n\nReturns verdict, confidence, cryptographic hashes (keccak256), and\nring breakdown. Idempotent: same inputs -> same evidence_hash."
      operationId: verify_evidence_api_v1_arbiter_verify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArbiterVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbiterVerifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
