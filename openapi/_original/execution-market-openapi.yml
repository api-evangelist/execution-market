          description: Task UUID
          title: Task Id
        description: Task UUID
      - name: action
        in: query
        required: false
        schema:
          type: string
          pattern: ^(release|refundInEscrow)$
          description: '''release'' or ''refundInEscrow'''
          default: release
          title: Action
        description: '''release'' or ''refundInEscrow'''
      responses:
