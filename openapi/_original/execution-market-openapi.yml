    SessionChallengeRequest:
      properties:
        wallet:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
          title: Wallet
          description: Wallet that will sign the grant and act as principal
        audience:
          anyOf:
          - type: string
          - type: 'null'
          title: Audience
          description: Host the grant is bound to. Must be one of the deployment's authorities (see GET /auth/erc8128/info). Defaults to the first.
        ttl_seconds:
          anyOf:
          - type: integer
            maximum: 900.0
            minimum: 1.0
          - type: 'null'
          title: Ttl Seconds
          description: Requested lifetime in seconds. Capped at 900 by the server.
      type: object
      required:
      - wallet
      title: SessionChallengeRequest
      description: Ask the server to build an unsigned ``SessionGrant`` (EIP-712).
    SessionChallengeResponse:
      properties:
        typed_data:
          additionalProperties: true
          type: object
          title: Typed Data
          description: 'Complete EIP-712 payload: types, primaryType, domain, message'
        expires_at:
          type: integer
          title: Expires At
          description: Unix seconds when the grant stops being accepted
        header:
          type: string
          title: Header
          description: Header name to send the signed grant in
        header_template:
          additionalProperties: true
          type: object
          title: Header Template
          description: 'Header value shape: the message verbatim plus the signature'
        sign_with:
          $ref: '#/components/schemas/SessionSigningHint'
          description: Signing instructions
      type: object
      required:
      - typed_data
      - expires_at
      - header
      - header_template
      - sign_with
      title: SessionChallengeResponse
      description: 'An unsigned ``SessionGrant`` plus how to replay it once signed.


        The server owns nonce, timestamps, types and domain: the client contributes

        only a signature. ``typed_data`` is signed VERBATIM — re-serialising it

        with different key order is fine, editing any value is not (the server

        rebuilds the struct from its own constants and requires the recovered

        address to equal ``wallet``).'
    SessionSigningHint:
      properties:
        tool:
          type: string
          title: Tool
          description: Wallet tool to call (request_wallet_sign)
        op:
          type: string
          title: Op
          description: Signing intent (typedData)
        payload_ref:
          type: string
          title: Payload Ref
          description: JSON path of the payload to sign, verbatim
      type: object
      required:
      - tool
      - op
      - payload_ref
      title: SessionSigningHint
      description: How to feed the typed data to a wallet that signs EIP-712.
    SettleTaskChannelRequest:
      properties:
        channel_id:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          title: Channel Id
          description: Channel to settle (base58). Must be the one bound to this task.
        cumulative_uusdc:
          type: integer
          minimum: 1.0
          title: Cumulative Uusdc
          description: Total the voucher commits, in micro-USDC, counted from the channel open — cumulative, not incremental. Must exceed what is already settled on chain and must not exceed the deposit.
        expires_at:
          type: integer
          minimum: 1.0
          title: Expires At
          description: Unix seconds after which the voucher is void. The program enforces it when the transaction lands, so leave real margin (an hour); EM refuses anything expiring within 60 seconds.
        signature:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,100}$
          title: Signature
          description: 'Base58 of the 64-byte raw ed25519 signature of the session key over voucher_message_bytes(channel_id, cumulative_uusdc, expires_at) — 50 bytes: magic 0x5601 | channelId(32) | u64 LE | i64 LE. Not the JSON, no personal_sign prefix, not base64.'
        session_pubkey:
          anyOf:
          - type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          - type: 'null'
          title: Session Pubkey
          description: Optional. The key you signed with. Only ever CHECKED against the channel's on-chain authorized signer, so a mismatch reports itself instead of arriving as a bare 'invalid signature'.
      additionalProperties: false
      type: object
      required:
      - channel_id
      - cumulative_uusdc
      - expires_at
      - signature
      title: SettleTaskChannelRequest
      description: 'The payer''s cumulative voucher, so EM can liquidate a channel on chain.


        This is the escape hatch for a channel whose pay.sh session died: the

        channel is still open, the deposit is still in it, and nothing off-chain can

        move it any more. What CAN move it is the payer''s own signature — the

        program credits the payee only against an ed25519 instruction verifying

        ``channel.authorized_signer`` over ``voucher(channel, cumulative,

        expires_at)``, and neither ``settle`` nor ``distribute`` takes a signer

        account. So the payer signs, EM broadcasts, and EM''s key authorises nothing

        beyond paying the network fee.


        There is deliberately NO field for the split: the distribution is committed

        on chain at ``open`` (``channel.distribution_hash``) and is immutable, so

        offering it here would be offering a choice that does not exist.'
