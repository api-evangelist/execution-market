    JevSellerVeto:
      properties:
        sospechoso_jev:
          type: boolean
          title: Sospechoso Jev
          description: 'True when Jev read this seller''s record as a manufactured reputation (score >= threshold). Advisory: it never blocks an order, hides a listing or reorders the board.'
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
          description: Jev's answer to the manufactured-reputation question (0-1). Null when Jev did not answer — which is not a zero.
        threshold:
          type: number
          title: Threshold
          description: The threshold the score was read against, frozen by the gate of 2026-09-18 for this exact model version. It travels with the score because a number without its bar is not a measurement.
        model:
          type: string
          title: Model
          description: The pinned Jev version that answered.
        injection_flagged:
          type: boolean
          title: Injection Flagged
          description: True when the seller's own description was written to steer the evaluator. The score is still reported, marked.
        state_questions_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: State Questions Hash
          description: sha256 of the exact (state, questions) pair sent, so the answer can be recomputed later without keeping the seller's prose.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why Jev did not answer, when it did not.
        legend:
          type: string
          title: Legend
          description: Says, in the payload itself, that this marks and does not decide.
      type: object
      required:
      - sospechoso_jev
      - threshold
      - model
      - injection_flagged
      - legend
      title: JevSellerVeto
      description: 'Jev''s C4 second opinion on a seller. A MARK, never a decision.


        Present only when ``EM_JEV_VETO_C4_ENABLED`` is on AND Jev answered inside

        its 2 s budget. **Absent is not clean**: a provider that was slow, down or

        missing its key produces no field at all, and nothing in this response says

        a seller was vetted.


        ``sospechoso_jev`` false means "not marked", which is also not "clean" — the

        gate measured C4 against labels we authored ourselves, so it is allowed to

        close a row and never to open one.


        No ``confidence`` is carried and none exists: the decisive question is a

        Noul, and the gate''s axis B is not measurable for this case at all.'
