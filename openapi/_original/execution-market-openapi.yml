    PublisherReputation:
      properties:
        avg_score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Avg Score
          description: Average score 0-100 received as a publisher
        rating_count:
          type: integer
          minimum: 1.0
          title: Rating Count
          description: How many ratings back that average (always >= 1)
        rater_count:
          type: integer
          minimum: 0.0
          title: Rater Count
          description: How many DISTINCT workers rated this publisher
        signed_count:
          type: integer
          minimum: 0.0
          title: Signed Count
          description: How many of them are authored on-chain by the rater itself (EIP-7702 signed rail) rather than relayed under our key
        last_rated_at:
          type: string
          format: date-time
          title: Last Rated At
          description: Timestamp of the most recent rating (ISO 8601)
        executor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Executor Id
          description: 'The publisher''s executor row, when it has one. NULL is normal: 3 publishers holding 8.9% of all opinions — including the #1 by volume — have no executors row at all.'
      type: object
      required:
      - avg_score
      - rating_count
      - rater_count
      - signed_count
      - last_rated_at
      title: PublisherReputation
      description: 'What this task''s PUBLISHER received from the workers it hired.


        A nested object on purpose, never loose floats on ``TaskResponse``: the

        absence of ratings is ONE whole ``null``, not a score of 0 with a count of

        0. Migration 205 enforces the same thing in the schema — the row exists if

        and only if ``rating_count > 0`` — so a field of this model can never be

        the fabricated zero of INC-2026-08-26.


        Scale is **0-100**, the same as ``effective_reputation_score`` (the source

        is ``feedback_documents.score``). It is NOT the 0-5 ``avg_rating`` of the

        other direction, and the two must never be merged or converted into each

        other: ``score / 20`` would be a third formula nobody agreed to.


        This is the **breakdown**, not a rival score: ``onchain_reputation_score``

        already counts these opinions, mixed in with the ones the same wallet got

        as a worker. Surfaces must label it as such.'
    PublisherReputationResponse:
      properties:
        publisher_key:
          type: string
          title: Publisher Key
          description: 'Canonical publisher identity: lower(COALESCE(NULLIF(tasks.human_wallet,''''), tasks.agent_id)). Echoed back normalised, so a caller can tell which key answered.'
        avg_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Score
          description: Average score 0-100. Null = no ratings, never 0.
        rating_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rating Count
          description: How many ratings back the average. Null = no ratings.
        rater_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rater Count
          description: Distinct workers who rated this publisher.
        signed_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Signed Count
          description: How many are authored on-chain by the rater itself (EIP-7702 signed rail) rather than relayed under our key.
        last_rated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Rated At
          description: Timestamp of the most recent rating.
        executor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Executor Id
          description: 'The publisher''s executors row when it has one. Null is normal: 3 publishers holding 8.9% of all opinions — including the #1 by volume — have no executors row.'
      type: object
      required:
      - publisher_key
      title: PublisherReputationResponse
      description: 'What a PUBLISHER received from the workers it hired (migration 205).


        Flat, not a wrapper: here the key IS the subject, so a caller that asked

        about one publisher reads ``avg_score`` directly. When that publisher has

        no ratings every field except ``publisher_key`` is ``null`` — HTTP 200,

        never 404, and **never a zero**. A 0 on a 0-100 scale reads as "the worst

        publisher on the market", which is not a claim we can make about someone

        nobody has rated (INC-2026-08-26).'
