      summary: Cross-chain reputation (describe.net snapshot)
      description: 'A wallet''s multi-chain ERC-8004 reputation **as computed by describe.net**, served from EM''s own snapshot of `GET /wallets/{wallet}/chains` with the snapshot''s age (`retrieved_at`) and `policy_version` attached. EM aggregates nothing: `final_score` is describe.net''s `global_score`, and it is **null — never 0 — when the index holds no eligible ratings** or the wallet has never been reconciled. Chains with an identity but no ratings are counted in `chains_skipped`, not rendered as a zero.'
      operationId: get_cross_chain_reputation_endpoint_api_v1_reputation_wallet__wallet_address__cross_chain_get
      parameters:
      - name: wallet_address
        in: path
        required: true
        schema:
