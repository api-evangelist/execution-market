          title: Onchain Reputation Score
          description: The seller's ERC-8004 on-chain aggregate. Null when the seller has no on-chain identity or has not been reconciled yet — which is different from a zero.
        seller_correlation:
          anyOf:
          - $ref: '#/components/schemas/SellerCorrelation'
          - type: 'null'
          description: 'Advisory anti-Sybil signal: is this seller''s completed history concentrated in one counterparty? Null when unavailable.'
        jev_veto:
