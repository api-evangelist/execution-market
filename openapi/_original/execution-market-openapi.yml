  /api/v1/submissions/{submission_id}/approve/challenge:
    get:
      tags:
      - Submissions
      - Submissions
      - Agent
      - Payments
      summary: Approve Submission Challenge
      description: 'Return the EIP-712 `ReleaseApproval` a signed-session principal must sign to approve this submission, and the header to send it back in (`X-EM-Approval`). Read-only: it approves nothing and releases nothing.


        Approve is the step that RELEASES the escrow, and it does so with no signature of its own. A session grant is a bearer for its window, so the bridge refuses approve on the session alone and asks for a second signature that names THIS submission — copying a session header out of a log must not buy the ability to pay out a worker.


        Principals authenticated with ERC-8128 do not need this: their request is already signed per-request.'
      operationId: get_approve_challenge_api_v1_submissions__submission_id__approve_challenge_get
      parameters:
      - name: submission_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the submission
          title: Submission Id
        description: UUID of the submission
      responses:
        '200':
          description: The ReleaseApproval typed data to sign
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to approve this submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
