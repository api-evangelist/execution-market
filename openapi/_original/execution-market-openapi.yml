      description: Result of ENS linking.
    LinkWalletRequest:
      properties:
        wallet_address:
          type: string
          pattern: ^0x[a-fA-F0-9]{40}$
          title: Wallet Address
          description: The wallet that signed the message (0x-prefixed, 42 chars)
        message:
          anyOf:
          - type: string
            maxLength: 300
            minLength: 60
          - type: 'null'
          title: Message
          description: 'Exact human-readable message that was signed. Format: ''Execution Market: link wallet <wallet> to session at <ISO8601 UTC>''. Required unless dynamic_jwt is provided.'
        signature:
          anyOf:
          - type: string
            pattern: ^0x(?:[a-fA-F0-9]{2}){65,4096}$
          - type: 'null'
          title: Signature
          description: Signature of the message by wallet_address. 65-byte EIP-191 EOA signatures are verified via ecrecover; any other length is treated as a smart-wallet signature and verified on-chain via ERC-1271 isValidSignature (ERC-6492 envelopes accepted for DEPLOYED wallets). Required unless dynamic_jwt is provided.
        dynamic_jwt:
          anyOf:
          - type: string
            maxLength: 10000
            minLength: 20
          - type: 'null'
          title: Dynamic Jwt
          description: Dynamic session JWT (alternative ownership proof for Dynamic EMBEDDED wallets only). When present, message/signature are not required.
      additionalProperties: false
      type: object
      required:
      - wallet_address
      title: LinkWalletRequest
      description: 'Request to link the caller''s wallet to their current Supabase session.


        Binds ``executors.user_id`` to the JWT ``sub`` so worker-auth endpoints can

        resolve the executor. The wallet must sign the exact ``message`` to prove

        ownership (this is what authorizes the rebind under migration 111''s

        "proven owner" rule). The message MUST follow the format

        ``"Execution Market: link wallet <wallet> to Supabase user <sub> at <ISO8601 UTC>"``

        and the timestamp must be within the last 10 minutes (replay protection).

        The ``<sub>`` binds the signature to the caller''s session, so a captured

        signature cannot be replayed under a different JWT to hijack the executor.


        Alternative proof (Dynamic embedded wallets only, INC 2026-07-10): instead

        of ``message`` + ``signature``, pass ``dynamic_jwt`` — the Dynamic session

        JWT. The backend verifies it against Dynamic''s JWKS (RS256) and requires

        the wallet to appear in ``verified_credentials`` with

        ``wallet_provider == ''embeddedWallet''``. Dynamic custodies embedded-wallet

        keys, so possession of the session IS ownership of the wallet; external

        wallets must keep using the signature flow.'
    LinkWalletResponse:
      properties:
        message:
          type: string
          title: Message
          description: Human-readable result message
        executor_id:
          type: string
          title: Executor Id
          description: UUID of the executor bound to the session
        wallet_address:
          type: string
          title: Wallet Address
          description: Linked wallet address (lowercase)
        linked:
          type: boolean
          title: Linked
          description: False when the wallet was already linked to this session (no-op)
      type: object
      required:
      - message
      - executor_id
      - wallet_address
      - linked
      title: LinkWalletResponse
      description: Response for linking a wallet to the current session.
