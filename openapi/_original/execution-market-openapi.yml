        in: path
        required: true
        schema:
          type: string
          title: Channel Id
      - name: replay
        in: query
        required: false
        schema:
          type: boolean
          description: If true, flush historical events from the DB mirror before live stream starts.
          default: true
          title: Replay
        description: If true, flush historical events from the DB mirror before live stream starts.
      - name: replay_limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 1000
            minimum: 1
          - type: 'null'
          description: Override max replay events (capped at EM_TAXIMETRO_REPLAY_LIMIT).
          title: Replay Limit
        description: Override max replay events (capped at EM_TAXIMETRO_REPLAY_LIMIT).
      responses:
