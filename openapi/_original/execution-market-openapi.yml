          - type: 'null'
          description: Filter by submission ID
          title: Submission Id
        description: Filter by submission ID
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by task category (via join)
          title: Category
        description: Filter by task category (via join)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
