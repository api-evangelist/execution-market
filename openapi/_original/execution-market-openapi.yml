      summary: Reclaim data for the payer (unsigned calldata)
      description: 'Everything the PAYER needs to recover the unspent cap themselves: the escrow address, the chain id, ABI-encoded `reclaim(PaymentInfo)` calldata and the instant it becomes eligible. **EM never signs and never sends this transaction** — the payer submits it from their own wallet (ADR-001), which is what makes the escape hatch trustless: it works even if EM is down, malicious or refuses. `reclaim` is `onlySender(info.payer)` and requires `block.timestamp > authorizationExpiry`.


        Payer-only: the response carries the signed escrow authorization, so it is never part of the unsigned session read (D12).'
      operationId: get_stream_session_reclaim_api_v1_streams_session__session_id__reclaim_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: Session UUID
          title: Session Id
        description: Session UUID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/streams/session/{session_id}/close:
    post:
      tags:
      - Streams
      summary: Close a stream session (payer or provider)
      description: 'Close a session. Cancelable by BOTH parties (D6): the payer (viewer) or the provider (stream publisher). Settles the final accrued via the Facilitator; any cap remainder is parked as ''remainder_reclaimable'' — the payer recovers it trustlessly via reclaim() after authorizationExpiry (refundInEscrow post-release is broken, ADR-005 §Deuda — never called).'
      operationId: close_stream_session_api_v1_streams_session__session_id__close_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
