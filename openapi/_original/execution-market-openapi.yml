    ExecutorReputation:
      properties:
        effective_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Effective Reputation Score
          description: COALESCE(onchain_reputation_score, reputation_score), 0-100 — the score every min_reputation gate and the leaderboard use. Null means unrated, not zero.
        onchain_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Onchain Reputation Score
          description: ERC-8004 aggregate cached by the reputation reconciler (0-100). Null when the executor has no on-chain identity or is not yet reconciled.
        reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Reputation Score
          description: Mutable DB heuristic (0-100)
        tasks_completed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tasks Completed
          description: Number of completed tasks
        avg_rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Rating
          description: Average rating received as a worker, 0-5 scale — NOT the 0-100 scores above; never convert one into the other
      type: object
      title: ExecutorReputation
      description: 'What this task''s assigned EXECUTOR has received as a worker.


        The mirror of :class:`PublisherReputation` for the other party, read from

        the same ``executors`` columns the leaderboard ranks by. Nested for the

        same reason: no executor, or a lookup that could not be read, is ONE whole

        ``null`` — never a row of zeros.


        Inside the object a ``null`` score is also an absence: since migration 203

        an executor nobody has rated reads ``effective_reputation_score = NULL``,

        and that means "unrated", not "rated 0".'
    FeedbackResponse:
      properties:
        success:
          type: boolean
          title: Success
        transaction_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Hash
        feedback_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Feedback Index
        network:
          type: string
          title: Network
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        reputation_network_requested:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Requested
          description: 'The chain this rating was SUPPOSED to land on: the ratee''s explicit choice if they made one, otherwise the task''s payment chain. The payment-chain default applies to every network, not just Solana — an arbitrum-paid task with no choice now seals on arbitrum, where before 2026-09-10 it sealed on base.'
        reputation_network_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Used
          description: The chain it actually landed on. Equal to `reputation_network_requested` unless something forced a change — in which case `reputation_network_fallback_reason` says what.
        reputation_network_fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Fallback Reason
          description: 'Why the rating changed chain, or null when it did not: `no_identity_on_chain` (the ratee holds no ERC-8004 identity there and one could not be minted), `chain_not_capable` (the chain cannot carry ERC-8004 reputation we can author), `chain_guard` (the agent id we hold lives on another chain and ids are per-chain), `pref_disabled` (cross-chain reputation is switched off). Until 2026-09-10 this was silent: 18 ratings of Solana-paid work sealed on Base and every response said only `success: true`.'
      type: object
      required:
      - success
      - network
      title: FeedbackResponse
      description: Response after submitting feedback.
