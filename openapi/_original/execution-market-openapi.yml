    post:
      tags:
      - Reputation
      summary: Which tasks are already rated, in batch
      description: 'Answers ''have I already rated this?'' for up to 500 tasks in one call, WITHOUT writing anything.


        Built because the only way to find out used to be to try the write and read the 409 — which means discovering the duplicate by creating it. On-chain reputation does not come back, so at sweep scale that is the difference between measuring the debt and doubling it.


        Directions are the same strings `relay/prepare` takes (`publisher_rates_executor`, `executor_rates_publisher`), plus the legacy rail''s own names when a rating came from the runtime.'
      operationId: rated_status_api_v1_reputation_rated_status_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatedStatusRequest'
        required: true
