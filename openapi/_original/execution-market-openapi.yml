      summary: Record the payer-signed order that authorizes the release
      description: 'Verify a `LifecycleOrder` signed by the payer (or, for `refundInEscrow`, by the receiver) and store it next to the escrow. The next release for this task attaches it to the Facilitator call.


        **Verification is not a formality**: the typed data is rebuilt server-side from the escrow''s own `paymentInfo` and the amount that will actually be sent, never from anything the caller asserts. An order signed over a different struct recovers a *different, valid* address — so the check that carries the guarantee is that the recovered address is the one the Facilitator''s role table accepts.


        Idempotent per order: posting the same signature again is a no-op.'
