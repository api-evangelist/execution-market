        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the executor you intend to assign
          title: Executor Id
        description: UUID of the executor you intend to assign
      responses:
        '200':
          description: The signable escrow challenge for this assignment
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
