        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
    post:
      tags:
      - Disputes
      summary: Create Dispute
      description: "Publisher-initiated dispute against a submission (Phase 3).\n\nReplaces the silent Ring 2 auto-escalation that was removed in Phase 1.\nThe publisher explicitly decides a submission is fraudulent/non-compliant\nand opens a dispute -- this is a conscious action with a paper trail.\n\nPreconditions:\n  - Caller is authenticated with ERC-8128 wallet signing\n  - Submission exists\n  - Caller is the publisher of the parent task (wallet or agent_id match)\n  - Submission has no active dispute (no open/under_review/in_arbitration row)\n  - Submission has not been paid yet (can't dispute a settled submission)\n\nSide effects:\n  - Inserts a disputes row with escalation_tier=1 (human-initiated)\n  - Sets submissions.agent_verdict='disputed' (explicit publisher decision;\n    trigger trg_submissions_verdict_change writes a payment_events audit row)\n  - Emits dispute.opened event\n  - Moves the TASK to 'disputed' (explicitly — no trigger does this)"
      operationId: create_dispute_api_v1_disputes_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisputeDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
