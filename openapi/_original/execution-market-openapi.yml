    Dx402KeyRequest:
      properties:
        public_key:
          type: string
          title: Public Key
          description: 'Your DX402 PUBLIC key: SEC1-compressed secp256k1 (`0x02`/`0x03` + 64 hex) or X25519 (`0x` + 64 hex). This is public material -- never send a private key. It SHOULD NOT be your payment key: this one only ever decrypts, so a leak costs you readable evidence instead of your funds, and it is what lets a buyer on a custodial wallet open their own evidence at all (a custodian signs but does not do ECDH).'
          examples:
