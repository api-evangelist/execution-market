          type: string
          title: Ratee Role
        rater_wallet:
          type: string
          title: Rater Wallet
        ratee_agent_id:
          type: integer
          title: Ratee Agent Id
        tag1:
          type: string
          title: Tag1
        tag2:
          type: string
          title: Tag2
        endpoint:
          type: string
          title: Endpoint
        feedback_uri:
          type: string
          title: Feedback Uri
        feedback_hash:
          type: string
          title: Feedback Hash
        reputation_network_requested:
          anyOf:
