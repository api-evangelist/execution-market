  /health/:
    get:
      tags:
      - Health
      summary: Health Check
      description: "Liveness by default. Dependencies only when asked for.\n\n>>> THIS PATH IS THE ONE THE LOAD BALANCER AND ECS BOTH PROBE. <<<\nThe target group ``em-production-mcp-tg`` health-checks ``/health`` with a\n10 s timeout, and the task definition health-checks the SAME path from\ninside the container with ``curl -f http://localhost:8000/health`` and a\n5 s one. So whatever this endpoint waits on becomes a reason to kill the\ntask — and, because ``payshell`` starts only once ``mcp-server`` reports\nHEALTHY, a reason the REPLACEMENT task can never come up either.\n\nOn 2026-09-08 that is exactly what happened. Supabase started answering\n``57014 canceling statement due to statement timeout`` at 23:05:06Z; this\nhandler queried it; ``/health`` went from 50 ms to 24.8 s; both watchdogs\nfired; every replacement task sat PENDING with payshell waiting on a\ncontainer that would never be healthy; the target group held ZERO targets\nfor twenty-nine minutes. A degraded database became\
        \ no service at all,\nwhich is strictly worse than serving degraded.\n\nSo the default answer is about THIS PROCESS and nothing else: no database,\nno RPC, no S3, no facilitator, no thread hand-off. It cannot be slower than\nbuilding a dict, so it cannot be the reason a task dies.\n\nThe dependency picture did not go away — ask for it with ``?deps=true``\n(``?force=true`` implies it, which is what the admin dashboard already\nsends). That path answers 503 when a critical component is down, and it is\nbounded so that a hung dependency cannot hang the caller either.\n\nResponse Codes:\n- 200: process is alive (liveness), or system healthy/degraded (deps)\n- 503: deps only — a critical component is unhealthy\n\nArgs:\n    force: Run the dependency checks fresh, bypassing the 30 s cache\n    deps: Include the dependency checks\n\nReturns:\n    JSON object; ``probe`` names which of the two answers this is"
      operationId: health_check_health__get
      parameters:
      - name: force
        in: query
        required: false
        schema:
          type: boolean
          description: Run the dependency checks fresh, bypassing the cache
          default: false
          title: Force
        description: Run the dependency checks fresh, bypassing the cache
      - name: deps
        in: query
        required: false
        schema:
          type: boolean
          description: Include the dependency checks (database, chain, ...)
          default: false
          title: Deps
        description: Include the dependency checks (database, chain, ...)
      responses:
        '200':
          description: System is healthy or degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '503':
          description: System is unhealthy
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /health:
    get:
      tags:
      - Health
      summary: Health Check (Root)
      description: "Liveness by default. Dependencies only when asked for.\n\n>>> THIS PATH IS THE ONE THE LOAD BALANCER AND ECS BOTH PROBE. <<<\nThe target group ``em-production-mcp-tg`` health-checks ``/health`` with a\n10 s timeout, and the task definition health-checks the SAME path from\ninside the container with ``curl -f http://localhost:8000/health`` and a\n5 s one. So whatever this endpoint waits on becomes a reason to kill the\ntask — and, because ``payshell`` starts only once ``mcp-server`` reports\nHEALTHY, a reason the REPLACEMENT task can never come up either.\n\nOn 2026-09-08 that is exactly what happened. Supabase started answering\n``57014 canceling statement due to statement timeout`` at 23:05:06Z; this\nhandler queried it; ``/health`` went from 50 ms to 24.8 s; both watchdogs\nfired; every replacement task sat PENDING with payshell waiting on a\ncontainer that would never be healthy; the target group held ZERO targets\nfor twenty-nine minutes. A degraded database became\
        \ no service at all,\nwhich is strictly worse than serving degraded.\n\nSo the default answer is about THIS PROCESS and nothing else: no database,\nno RPC, no S3, no facilitator, no thread hand-off. It cannot be slower than\nbuilding a dict, so it cannot be the reason a task dies.\n\nThe dependency picture did not go away — ask for it with ``?deps=true``\n(``?force=true`` implies it, which is what the admin dashboard already\nsends). That path answers 503 when a critical component is down, and it is\nbounded so that a hung dependency cannot hang the caller either.\n\nResponse Codes:\n- 200: process is alive (liveness), or system healthy/degraded (deps)\n- 503: deps only — a critical component is unhealthy\n\nArgs:\n    force: Run the dependency checks fresh, bypassing the 30 s cache\n    deps: Include the dependency checks\n\nReturns:\n    JSON object; ``probe`` names which of the two answers this is"
      operationId: health_check_health_get
      parameters:
