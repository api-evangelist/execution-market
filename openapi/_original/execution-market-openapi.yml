  /api/v1/tasks/{task_id}/channel:
    post:
      tags:
      - Tasks
      - Tasks
      - Payments
      summary: Declare the payment channel that funds this task
      description: The payer declares the pay.sh MPP channel it already opened for this task. pay.sh strips payment headers before proxying, so this is how EM learns the channel id. The payee is resolved server-side from the assigned worker — a payee named in the body is only ever checked.
      operationId: declare_task_channel_api_v1_tasks__task_id__channel_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the task
          title: Task Id
        description: UUID of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeclareTaskChannelRequest'
      responses:
        '200':
          description: Channel bound to the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: '`CHANNEL_NOT_ON_CHAIN` — no payment-channel account exists at that id on Solana (the RPC answered, and said it is not there). Or `DECLARED_PAYER_DISAGREES` — the `payer` in the body is not the account that opened the channel on chain.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the task publisher, or the declared payee is not the worker, or `CHANNEL_NOT_YOURS` — the channel was opened on Solana by an account that is not registered to you.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Task has no assigned worker, wrong rail, or the channel belongs to another task. Or `WORKER_USDC_ATA_MISSING` — the worker's Solana payout address holds no USDC token account, so `distribute` would redirect its 87% to the program treasury instead of reverting. Carries `worker_usdc_ata` (the address to create) and `usdc_mint`; retryable once the worker's account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`CHANNEL_CAP_OUT_OF_RANGE`: the declared cap is outside the per-channel band (EM_SOLANA_SESSION_CAP_MIN_USD..MAX_USD), or no cap was declared at all and the task declares none either. `CHANNEL_PRICE_MISMATCH`: the price this channel would meter at disagrees with what the gateway charges per tick; the body carries `gateway_price_per_unit_uusdc`, which is the only price EM will bind. Omit `price_per_unit_uusdc` to take it. A malformed request body also answers 422, with FastAPI''s own validation shape.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: The platform already holds its maximum of open session channels. Carries Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`CHANNEL_UNREADABLE` — Solana could not be read, so EM cannot tell whether the channel is yours. **This is the only retryable outcome of the four** (`retryable: true`): the public RPC rate-limits and the next attempt usually lands. `WORKER_USDC_ATA_UNVERIFIABLE` is the same shape for the worker''s payout account: unreadable, so refused rather than allowed on an unanswered question.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/tasks/{task_id}/channel/settle:
    post:
      tags:
      - Tasks
      - Tasks
      - Payments
      summary: Settle this task's channel with the payer's cumulative voucher
      description: 'Liquidates a payment channel whose pay.sh session is gone. The payer signs a cumulative voucher with the channel''s session key; EM verifies it against the channel''s on-chain authorized signer, asks the pay.sh gateway — the channel''s fee payer — to broadcast `[ed25519, settle, distribute]`, and then reads the transaction back from the chain to confirm the worker was credited. Neither `settle` nor `distribute` takes a signer account, so nobody here gains any authority: without the payer''s signature the money cannot move, and with it anyone could submit the same transaction.


        EM names the recipients it asks the gateway to pay — the assigned worker''s Solana payout address and the platform''s worker share in basis points — and the gateway hashes them against the channel''s on-chain `distributionHash` before broadcasting. When any of that is refused, the gateway''s own JSON answer travels back NESTED under `detail.gateway`, uncut, next to the human-readable `message`.'
      operationId: settle_task_channel_api_v1_tasks__task_id__channel_settle_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the task
          title: Task Id
        description: UUID of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettleTaskChannelRequest'
      responses:
        '200':
          description: Channel settled on chain, or already was
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '202':
          description: 'The gateway named a settlement transaction and Solana could not confirm the credit inside the verification window. The transaction is RECORDED as pending (`status: settling`, `settlement_verified: false`) and reconciled from the chain — it is not a proof of payment yet, so ratings still refuse it. Retrying is safe and idempotent.'
        '400':
          description: The voucher does not parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the task publisher
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'The voucher cannot pay: wrong channel, wrong signer, expired, over the deposit, not monotonic, or the channel does not commit its share to the assigned worker (`distribution_mismatch` when the gateway is the one that says so, with its own answer nested under `detail.gateway`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 'The settlement landed and credited somebody else (`payout_redirected`). A transaction that merely could not be read back is a 202, not this: see above.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Solana unreadable, or the pay.sh gateway could not close the channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
