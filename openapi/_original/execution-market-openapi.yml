          type: string
          pattern: ^[a-z0-9-]{2,32}$
          title: Reputation Network
          description: Chain where this user's ERC-8004 reputation should live (one of the reputation-capable EVM chains, or 'solana' when enabled).
      additionalProperties: false
      type: object
      required:
      - reputation_network
      title: UpdateReputationNetworkRequest
      description: 'Request to set the chain where the user''s ERC-8004 reputation is written

        (decoupled from the payment chain; ratee-driven).'
    UpdateServiceAreaRequest:
      properties:
        center_lat:
          anyOf:
          - type: number
            maximum: 90.0
            minimum: -90.0
          - type: 'null'
          title: Center Lat
          description: Latitud del centro de la zona
        center_lng:
          anyOf:
          - type: number
            maximum: 180.0
            minimum: -180.0
          - type: 'null'
          title: Center Lng
          description: Longitud del centro de la zona
        radius_m:
          anyOf:
          - type: integer
            maximum: 500000.0
            minimum: 100.0
          - type: 'null'
          title: Radius M
          description: Radio en metros alrededor del centro (100 m a 500 km)
        polygon:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Polygon
          description: GeoJSON Polygon con la zona dibujada. Excluyente con center_lat/center_lng/radius_m.
      additionalProperties: false
      type: object
      title: UpdateServiceAreaRequest
      description: "La zona de operación que el worker declara (Chamba F2.2).\n\nDos formas de decir lo mismo, y el resultado guardado es siempre UN\npolígono (migración 217):\n\n* ``center_lat`` + ``center_lng`` + ``radius_m`` — el caso del slider.\n* ``polygon`` — un GeoJSON ``Polygon``, para dibujar el barrio a mano.\n  Es la forma que el producto quiere de verdad: una manicurista atiende\n  su barrio y el de al lado, no una circunferencia.\n\nUn cuerpo **vacío** borra la zona, y es un estado legítimo: el worker\nvuelve a ver todas las tareas. Mandar las dos formas a la vez es un error\ndel cliente, no una preferencia que el backend deba resolver adivinando.\n\nLos rangos espejan los CHECK de la migración 217 a propósito: si se\nseparan, la API acepta lo que la base rechaza y el worker recibe un 500\nsin explicación."
