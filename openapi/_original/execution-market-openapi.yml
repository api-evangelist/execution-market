                title: Response Get Supported Networks Api V1 Reputation Networks Get
  /api/v1/reputation/register:
    post:
      tags:
      - Reputation
      summary: Register Agent Endpoint
      description: 'Register a new agent on the ERC-8004 Identity Registry (gasless).


        The Ultravioleta Facilitator pays all gas fees. The caller does not

        need ETH or any native token on the target chain.


        Supported networks: ethereum, base, polygon, arbitrum, celo, bsc,

        monad, avalanche, and their testnets.


        If `recipient` is specified, the minted ERC-721 NFT is automatically

        transferred to that address after registration.


        **Hybrid sync/async**: the facilitator mint is synchronous (p95 ~28s).

        This endpoint waits up to ~20s (`EM_REGISTER_SYNC_BUDGET_S`); if the

        facilitator confirms in time, the usual 200 is returned. Otherwise it

        answers **202 Accepted** with a `registration_id` and a `poll` URL —

        the mint keeps running facilitator-side and

        `GET /api/v1/reputation/register/{registration_id}` resolves the

        outcome from the chain itself. NEVER blind-retry the POST: a duplicate

        register call mints a duplicate identity.'
      operationId: register_agent_endpoint_api_v1_reputation_register_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bearer <supabase_jwt>
          title: Authorization
        description: Bearer <supabase_jwt>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAgentRequest'
      responses:
        '200':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterAgentResponse'
        '202':
          description: Facilitator still minting — poll the returned URL until status is completed/failed. Do NOT re-POST.
        '400':
          description: Invalid network or parameters
        '503':
          description: ERC-8004 integration unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reputation/register/{registration_id}:
    get:
      tags:
      - Reputation
      summary: Get Registration Status
      description: 'Poll an async registration job (the 202 flow of POST /register).


        Self-healing: while the job is pending, this endpoint checks

        `balanceOf(wallet)` on the Identity Registry — the on-chain state is the

        source of truth, so a pending job is resolvable even after a server

        restart. When the mint has landed, the row flips to `completed`, the

        agent id is persisted to the executor profile, and the auth identity

        cache is purged.'
      operationId: get_registration_status_api_v1_reputation_register__registration_id__get
      parameters:
      - name: registration_id
        in: path
        required: true
        schema:
          type: string
          description: registration_id from the 202 response
          title: Registration Id
        description: registration_id from the 202 response
      responses:
        '200':
          description: Registration job status (self-heals from chain)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationStatusResponse'
        '404':
          description: Unknown registration_id
        '503':
          description: ERC-8004 integration unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
