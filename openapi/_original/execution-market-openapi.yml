  /.well-known/oauth-authorization-server:
    get:
      tags:
      - OAuth Discovery
      summary: OAuth 2.0 Authorization Server Metadata (RFC 8414)
      description: 'Discovery document for the Execution Market authorization server. Served **only** on the issuer host, because RFC 8414 §3.3 requires the `issuer` field to be identical to the host the client fetched it from — a document served elsewhere is one a conforming client must reject. Follow `resource_metadata` from the 401 challenge to reach the right host.


        Returns 404 when `EM_OAUTH_ENABLED` is off.'
      operationId: oauth_authorization_server_metadata__well_known_oauth_authorization_server_get
      responses:
        '200':
          description: The authorization server metadata
          content:
            application/json:
              schema: {}
        '404':
          description: OAuth disabled, or this host is not the issuer
      security: []
  /.well-known/oauth-protected-resource:
    get:
      tags:
      - OAuth Discovery
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728)
      description: 'Names the authorization server for the MCP endpoint, the scopes it understands, and the non-OAuth rails. This is the document the 401 challenge points at.


        Returns 404 when `EM_OAUTH_ENABLED` is off.'
      operationId: oauth_protected_resource_metadata__well_known_oauth_protected_resource_get
      responses:
        '200':
          description: The protected resource metadata
          content:
            application/json:
              schema: {}
        '404':
          description: OAuth disabled on this deployment
      security: []
  /.well-known/oauth-protected-resource/mcp:
    get:
      tags:
      - OAuth Discovery
      summary: OAuth 2.0 Protected Resource Metadata (RFC 9728, path form)
      description: Identical to `/.well-known/oauth-protected-resource`. Both exist because an MCP client with no `WWW-Authenticate` to follow probes the path-suffixed form FIRST and the root form second; serving only one leaves the client that falls into the other with no discovery at all.
      operationId: oauth_protected_resource_metadata_mcp__well_known_oauth_protected_resource_mcp_get
      responses:
        '200':
          description: The protected resource metadata
          content:
            application/json:
              schema: {}
        '404':
          description: OAuth disabled on this deployment
      security: []
  /.well-known/jwks.json:
    get:
      tags:
      - OAuth
      summary: JSON Web Key Set
      description: 'The public keys that verify access tokens issued by this authorization server. Two keys are published while a rotation is in flight: the one signing now and the one that will sign next.


        Served only on the issuer host, and only when `EM_OAUTH_ENABLED` is on.'
      operationId: jwks_document__well_known_jwks_json_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security: []
  /oauth/register:
    post:
      tags:
      - OAuth
      summary: Dynamic Client Registration (RFC 7591)
      description: 'Register a public client. **This is the fallback**: the MCP authorization spec (2026-07-28) marks Dynamic Client Registration deprecated and recommends Client ID Metadata Documents, which need no registration at all — just use an https URL with a path as your `client_id`.


        No client secret is issued, ever. `token_endpoint_auth_method` must be `none` and PKCE is mandatory.'
      operationId: register_client_oauth_register_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /oauth/authorize:
    get:
      tags:
      - OAuth
      summary: Authorization endpoint (OAuth 2.1, PKCE required)
      description: 'Validates the request server-side and redirects the user to the consent screen. PKCE with `S256` is **mandatory**: a request without `code_challenge`, or with `code_challenge_method` other than `S256`, is refused.


        `redirect_uri` is matched **exactly** against the client''s registration — from the Client ID Metadata Document for a URL `client_id`, or from the dynamic registration otherwise. It is never taken from the parameter alone.


        Errors are redirected to the client only once the redirect has been validated; before that they render an error page, because redirecting an error to an unvalidated URI is an open redirect.'
      operationId: authorize_oauth_authorize_get
      responses:
        '307':
          description: Successful Response
  /oauth/consent:
    get:
      tags:
      - OAuth
      summary: Sign-in and consent screen
      description: 'Sign in with Ethereum (EIP-4361) and choose which scopes to grant.


        Two ways to sign, and the key never leaves wherever it lives: a browser wallet through EIP-1193 `personal_sign`, or the message copied into PayBox (`request_wallet_sign`), OWS (`ows_sign_eip191`) or any other wallet, with the signature pasted back.


        Reads the pending request WITHOUT consuming it, so a reload or a browser prefetch does not burn the nonce.'
      operationId: consent_page_oauth_consent_get
      responses:
        '200':
          description: Successful Response
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - OAuth
      summary: Submit the signed consent
      description: 'Verifies the CSRF pair, verifies the EIP-4361 signature against the message **rebuilt on the server**, records the consent and redirects to the client with a single-use authorization code.


        The message is never taken from the request: a verifier that checks a signature over text the caller supplied checks nothing.'
      operationId: consent_submit_oauth_consent_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_consent_submit_oauth_consent_post'
      responses:
        '307':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/consent/{rid}/signature:
    post:
      tags:
      - OAuth
      summary: Deliver a signature for a pending sign-in
      description: 'Public. Accepts the EIP-4361 signature for one pending authorization request, so a wallet that is not in the browser can finish a sign-in without a human carrying the signature back by hand.


        Authorised by the **delivery token** the consent screen puts inside the block it asks you to paste into your agent''s chat. That token is a MAC over the wallet, the scopes and the approval caps, so those cannot be chosen here — the message is rebuilt from the server''s own record and the token''s authenticated fields, and the signature is verified against that.


        **One delivery per sign-in.** A signature that does not verify is refused and leaves the request open, so signing again is safe; a second accepted delivery is impossible. `GET` is accepted on the same path for agents that cannot make a POST — same checks, same limit.'
      operationId: deliver_consent_signature_oauth_consent__rid__signature_post
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Deliver Consent Signature Oauth Consent  Rid  Signature Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/consent/{rid}/status:
    get:
      tags:
      - OAuth
      summary: Whether a signature has arrived for this sign-in
      description: 'Polled by the consent screen. Authorised by the `em_oauth_csrf_<rid>` cookie — `HttpOnly`, `Secure` and path-scoped — so only the browser that started the authorization can read a delivered signature back.


        `{"state": "pending"}` while nothing has arrived (with `error` set when a delivery was refused), `{"state": "signed", "signature": "0x…"}` once one has, `{"state": "gone"}` when the request is no longer pending.'
      operationId: consent_signature_status_oauth_consent__rid__status_get
      parameters:
      - name: rid
        in: path
        required: true
        schema:
          type: string
          title: Rid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                title: Response Consent Signature Status Oauth Consent  Rid  Status Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /oauth/token:
    post:
      tags:
      - OAuth
      summary: Token endpoint (authorization_code, refresh_token)
      description: 'Exchanges a single-use authorization code plus its PKCE `code_verifier` for an access token, or rotates a refresh token.


        **Refresh tokens rotate on every use and reuse kills the family.** A refresh that was already rotated and shows up again means somebody holds a copy — the legitimate client or the thief, and there is no way to tell — so both are cut off and the user re-consents.


        **`agent:approve` does not survive a refresh.** It is the one scope that releases escrow without a per-operation signature, it is consented to separately, and it is re-granted only by consenting again.'
      operationId: token_oauth_token_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /oauth/revoke:
    post:
      tags:
      - OAuth
      summary: Token revocation (RFC 7009)
      description: 'Revokes a refresh token **and every rotation in its family**. Returns 200 whether or not the token existed, as RFC 7009 §2.2 requires: a different answer for an unknown token would make this endpoint an oracle for guessing them.


        Access tokens are not revoked — they are self-contained and live at most one hour (fifteen minutes when they carry `agent:approve`).'
      operationId: revoke_oauth_revoke_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_revoke_oauth_revoke_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
