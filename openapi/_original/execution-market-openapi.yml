          - type: 'null'
          title: Arbiter Latency Ms
          description: Wall-clock time the arbiter took, in milliseconds.
        evidence_content_hash:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Evidence Content Hash
          description: SHA-256 fetch+hash record for every referenced evidence deliverable ({algorithm, entries, deliverables, hashed, root, computed_at}). Null until the verification chokepoint has hashed the deliverables.
        durable_evidence:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Durable Evidence
          description: 'DX402 anchor receipt: a copy of this delivery, encrypted to the BUYER''s own key and anchored at the facilitator, recoverable months later with GET /dx402/evidence/{paymentId}. Carries {paymentId, pointer, backend, contentHash, cipher, keyAlg, mode, retention, receipt}; contentHash is over the PLAINTEXT, so a seller who anchored something other than what it served is detectable. Null means no evidence was anchored (buyer key not recoverable, non-EVM network, task opted out, or the anchor failed) - never an error.'
        verification_seal:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Verification Seal
          description: 'The evidence analysis this task''s publisher pre-paid at publish with `premium_verification: true`, and the only place they read it: {report, seal, seal_signature, signer, paid_by}. `report` carries {verdict, score, summary, artifact_hashes, model, analyzed_at}; `seal` is the canonical payload that was signed. Check it WITHOUT trusting this API: ecrecover over the seal JSON must return `signer`, and `signer` must equal IdentityRegistry.ownerOf(2106) on-chain. `paid_by` says who bought it — ''publisher'' for the pre-paid add-on and the post-hoc purchase, ''executor'' when the worker bought their own. Null means no analysis was purchased for this submission.'
