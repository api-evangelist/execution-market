          title: Hidden Flagged
          description: Listings dropped FROM THIS PAGE by `exclude_flagged`. The filter runs after the page is cut, so a page of 20 can return 14 — this says whether the missing 6 were hidden or simply do not exist. A seller whose first sales all went to one buyer is flagged and vanishes silently; set `exclude_flagged=false` to see them.
