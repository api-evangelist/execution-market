  /api/v1/escrow/task/{task_id}/reclaim:
    get:
      tags:
      - Escrow
      summary: Reclaim data for the task's payer (unsigned calldata)
      description: 'Everything the PAYER of a task escrow needs to recover locked funds themselves: escrow address, chain id, ABI-encoded `reclaim(PaymentInfo)` calldata and the instant it becomes eligible. **EM never signs and never sends this transaction** — the payer submits it from their own wallet, which is what makes the hatch trustless: it works even if EM is down, malicious or refuses.


        Use this when a task expired or was cancelled and the refund window (`refundExpiry`) already closed, so the operator''s refund reverts. `reclaim` is `onlySender(info.payer)` and requires `block.timestamp > authorizationExpiry`.


        Payer-only: the response carries the signed escrow authorization.'
