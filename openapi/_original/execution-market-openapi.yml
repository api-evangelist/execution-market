          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reputation/relay/prepare:
    post:
      tags:
      - Reputation
      summary: Relay Prepare Endpoint
      description: 'Step 1: what must the rater sign.


        Writes nothing on-chain and costs nothing. The reputation chain is resolved

        the same way as every other rating, which is what keeps a task paid on a

        chain without a delegate (Avalanche) from producing a facilitator-authored

        rating: the resolver sends it somewhere it can be authored properly.'
      operationId: relay_prepare_endpoint_api_v1_reputation_relay_prepare_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bearer <supabase_jwt>
          title: Authorization
        description: Bearer <supabase_jwt>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayPrepareRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelayPrepareResponse'
        '404':
          description: Task not found
        '409':
          description: Task state or parties do not allow rating yet
        '503':
          description: Chain has no FeedbackDelegate, or facilitator down
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/reputation/relay/submit:
    post:
      tags:
      - Reputation
      summary: Relay Submit Endpoint
      description: 'Step 2: relay the signature. The Facilitator pays; the rater is the author.


        The feedback parameters are passed through rather than re-derived: the

        Facilitator rebuilds the registry calldata from them and demands the

        signature cover exactly that, so altering one in flight breaks verification.


        That property protects the CONTENT of the rating, not the RIGHT to write it.

        The rater signs its own digest, and `chain_id`, `delegate` and the account

        nonce are all public — so nothing stops someone from building a valid

        signature without ever calling /relay/prepare, and posting it here for a

        task they had nothing to do with. Which is why this endpoint runs the same

        checks as prepare instead of trusting that prepare ran.'
      operationId: relay_submit_endpoint_api_v1_reputation_relay_submit_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Bearer <supabase_jwt>
          title: Authorization
        description: Bearer <supabase_jwt>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelaySubmitRequest'
      responses:
        '200':
          description: Rating written on-chain, authored by the rater
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Relay Submit Endpoint Api V1 Reputation Relay Submit Post
        '409':
          description: Task state or parties do not allow rating yet, or this direction was already rated by its signer
        '503':
          description: Facilitator refused or is unavailable
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
