          - type: 'null'
          description: Bearer <supabase_jwt>
          title: Authorization
        description: Bearer <supabase_jwt>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerWithdrawRequest'
      responses:
        '200':
          description: 'Stepped down: the task is back with its publisher'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: No verified worker identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the executor assigned to this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Task cannot be withdrawn from in its current state. Codes: `TASK_NOT_WITHDRAWABLE` (already submitted, or never assigned), `TASK_UNDER_DISPUTE` (arbitration owns it), `PAYMENT_CHANNEL_OPEN` (the Solana channel still holds its deposit), `ESCROW_REFUND_WINDOW_CLOSED` (the refund window closed on-chain — the payer''s reclaim is the only exit), `WITHDRAW_REFUND_BLOCKED`, `TASK_CHANGED_DURING_WITHDRAW`, `STREAM_TASK_NOT_WITHDRAWABLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Escrow refund failed — nothing changed, retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Escrow or channel state unverifiable — nothing changed, retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
