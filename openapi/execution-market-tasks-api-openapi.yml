      title: ValidationError
    CounterpartyCorrelation:
      properties:
        tasks_with_this_publisher:
          type: integer
          title: Tasks With This Publisher
          description: Applicant's completed tasks published by this task's publisher
        total_completed:
          type: integer
          title: Total Completed
          description: Applicant's total completed tasks (all publishers)
        distinct_publishers:
          type: integer
          title: Distinct Publishers
          description: Distinct publishers across the applicant's completed tasks
        concentration:
          type: number
          title: Concentration
          description: tasks_with_this_publisher / total_completed (0.0 when the applicant has no completed tasks)
        flagged:
          type: boolean
          title: Flagged
          description: True when total_completed >= 3 AND (concentration >= 0.8 OR distinct_publishers == 1). Advisory only.
      type: object
      required:
      - tasks_with_this_publisher
      - total_completed
      - distinct_publishers
      - concentration
      - flagged
      title: CounterpartyCorrelation
      description: 'Advisory anti-Sybil signal: how concentrated an applicant''s completed

        work is with this task''s publisher. Informational only — never blocks.'
    TargetExecutorType:
      type: string
      enum:
      - human
      - agent
      - robot
      - any
      title: TargetExecutorType
      description: Who can execute. ``any`` is the wildcard — any party may execute.
    SuccessResponse:
      properties:
        success:
          type: boolean
          title: Success
          description: Whether the operation succeeded
          default: true
        message:
          type: string
          title: Message
          description: Human-readable result message
        data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: Additional response data
      type: object
      required:
      - message
      title: SuccessResponse
      description: Generic success response.
    JevSellerVeto:
      properties:
        sospechoso_jev:
          type: boolean
          title: Sospechoso Jev
          description: 'True when Jev read this seller''s record as a manufactured reputation (score >= threshold). Advisory: it never blocks an order, hides a listing or reorders the board.'
        score:
          anyOf:
          - type: number
          - type: 'null'
          title: Score
          description: Jev's answer to the manufactured-reputation question (0-1). Null when Jev did not answer — which is not a zero.
        threshold:
          type: number
          title: Threshold
          description: The threshold the score was read against, frozen by the gate of 2026-09-18 for this exact model version. It travels with the score because a number without its bar is not a measurement.
        model:
          type: string
          title: Model
          description: The pinned Jev version that answered.
        injection_flagged:
          type: boolean
          title: Injection Flagged
          description: True when the seller's own description was written to steer the evaluator. The score is still reported, marked.
        state_questions_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: State Questions Hash
          description: sha256 of the exact (state, questions) pair sent, so the answer can be recomputed later without keeping the seller's prose.
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Why Jev did not answer, when it did not.
        legend:
          type: string
          title: Legend
          description: Says, in the payload itself, that this marks and does not decide.
      type: object
      required:
      - sospechoso_jev
      - threshold
      - model
      - injection_flagged
      - legend
      title: JevSellerVeto
      description: 'Jev''s C4 second opinion on a seller. A MARK, never a decision.


        Present only when ``EM_JEV_VETO_C4_ENABLED`` is on AND Jev answered inside

        its 2 s budget. **Absent is not clean**: a provider that was slow, down or

        missing its key produces no field at all, and nothing in this response says

        a seller was vetted.


        ``sospechoso_jev`` false means "not marked", which is also not "clean" — the

        gate measured C4 against labels we authored ourselves, so it is allowed to

        close a row and never to open one.


        No ``confidence`` is carried and none exists: the decisive question is a

        Noul, and the gate''s axis B is not measurable for this case at all.'
    ApplicationResponse:
      properties:
        id:
          type: string
          title: Id
          description: Application UUID
        task_id:
          type: string
          title: Task Id
          description: Task UUID
        executor_id:
          type: string
          title: Executor Id
          description: Worker/executor UUID
        wallet_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Wallet Address
          description: Worker wallet address (from executors table)
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Application message from worker
        status:
          type: string
          title: Status
          description: Application status (pending, accepted, rejected)
        created_at:
          type: string
          title: Created At
          description: ISO 8601 timestamp
        reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Reputation Score
          description: Worker reputation score — mutable DB heuristic (0-100)
        onchain_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Onchain Reputation Score
          description: ERC-8004 on-chain aggregate cached by the reputation reconciler (0-100). Null when the executor has no on-chain identity or is not yet reconciled.
        effective_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Effective Reputation Score
          description: COALESCE(onchain_reputation_score, reputation_score) — the score every min_reputation gate compares against. Rank applicants by this field.
        has_reputation_history:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Reputation History
          description: False when this applicant has never been rated and has completed no tasks — a cold start. Their effective_reputation_score reads 0.0 because there is nothing to average, NOT because anyone rated them badly; read this flag before ranking on the number.
        erc8004_agent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Erc8004 Agent Id
          description: ERC-8004 identity registry agent id, if registered
        tasks_completed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tasks Completed
          description: Number of completed tasks
        avg_rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Rating
          description: Average rating received (0-5 scale)
        jev_veto:
          anyOf:
          - $ref: '#/components/schemas/JevSellerVeto'
          - type: 'null'
          description: Jev's C4 mark on this applicant, ADDED to counterparty_correlation and replacing nothing. Null when the pilot flag is off or Jev did not answer — which is not a clean bill of health.
        counterparty_correlation:
          anyOf:
          - $ref: '#/components/schemas/CounterpartyCorrelation'
          - type: 'null'
          description: Advisory counterparty-correlation signal (anti-Sybil). Null when the aggregate is unavailable.
      type: object
      required:
      - id
      - task_id
      - executor_id
      - status
      - created_at
      title: ApplicationResponse
      description: Response model for a single task application.
    PaymentStreaming:
      properties:
        rail:
          type: string
          title: Rail
          description: 'Which rail carries the metered money. Today: ''solana_channel'' (a pay.sh MPP session; the buyer opens it and signs each voucher). Anything else is a 422 — this field is refused loudly rather than downgraded to a lump payment, because a publisher who asked to meter and got billed at approval would only find out from the receipt.'
        unit:
          type: string
          title: Unit
          description: 'What one unit of work is: ''second'' | ''minute'' | ''hour'' (elapsed time) or ''scan'' | ''token'' | ''byte'' (discrete confirmations). The executor reserves one delivery per unit; the meter reads either elapsed time or the count.'
        price_per_unit:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Price Per Unit
          description: 'USD charged per unit. Must be > 0. Small is normal: a per-second job prices in fractions of a cent.'
        cap_usd:
          anyOf:
          - type: number
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Cap Usd
          description: Hard ceiling in USD for the whole task. The buyer can never be charged past it, and whatever is not consumed is never charged at all. Must be > 0 and >= price_per_unit.
      additionalProperties: false
      type: object
      required:
      - rail
      - unit
      - price_per_unit
      - cap_usd
      title: PaymentStreaming
      description: 'Meter this task by UNIT OF WORK instead of one lump at approval.


        The buyer declares four things and nothing else: which rail carries the

        money, what a unit is, what a unit costs, and the most that may ever be

        spent. Everything downstream — who signs, when it settles, who gets the

        87% — is the rail''s business, not this model''s.


        >>> WHO SIGNS <<<

        On ``solana_channel`` the PAYER signs the channel open and every cumulative

        voucher. The executor signs NOTHING; it only names where its split lands.

        That is why a device with no ed25519 key on board can still get paid.


        >>> THE CAP IS THE POINT <<<

        ``cap_usd`` is the most the buyer can lose, and what is not consumed is not

        charged. It is validated against ``STREAM_CAP_MAX_USD`` — the SAME constant

        the EVM streaming rail enforces (``services.stream_metering``), imported

        rather than retyped, so the two surfaces cannot drift into two different

        ceilings for one concept.'
    TaskPaymentResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Task identifier
        status:
          type: string
          title: Status
          description: Derived payment status (pending, escrowed, completed, refunded, partial_released)
        total_amount:
          type: number
          title: Total Amount
          description: Total amount escrowed or paid in USDC
        released_amount:
          type: number
          title: Released Amount
          description: Amount released to the worker in USDC
        released_net_usdc:
          anyOf:
          - type: number
          - type: 'null'
          title: Released Net Usdc
          description: Net amount the worker received on-chain in USDC (released_amount minus the 13% platform fee split at release)
        platform_fee_usdc:
          anyOf:
          - type: number
          - type: 'null'
          title: Platform Fee Usdc
          description: Platform fee (13%) deducted on-chain at release, in USDC
        currency:
          type: string
          title: Currency
          description: Payment currency
          default: USDC
        escrow_tx:
          anyOf:
          - type: string
          - type: 'null'
          title: Escrow Tx
          description: Initial escrow deposit transaction hash
        release_tx:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Tx
          description: On-chain release transaction hash (worker payout, 87/13 split). Top-level mirror of escrow_tx; also present in the final_release event.
        refund_tx:
          anyOf:
          - type: string
          - type: 'null'
          title: Refund Tx
          description: On-chain refund transaction hash (if refunded)
        escrow_contract:
          anyOf:
          - type: string
          - type: 'null'
          title: Escrow Contract
          description: Escrow contract address (if applicable)
        network:
          type: string
          title: Network
          description: Primary payment network
          default: base
        events:
          items:
            $ref: '#/components/schemas/TaskPaymentEventResponse'
          type: array
          title: Events
          description: Chronological list of payment events
        created_at:
          type: string
          title: Created At
          description: When the payment timeline started
        updated_at:
          type: string
          title: Updated At
          description: Last event timestamp
      type: object
      required:
      - task_id
      - status
      - total_amount
      - released_amount
      - events
      - created_at
      - updated_at
      title: TaskPaymentResponse
      description: Canonical payment timeline and status for a task.
    CreateTaskRequest:
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 5
