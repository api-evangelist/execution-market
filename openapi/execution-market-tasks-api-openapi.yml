          application/json:
            schema:
              $ref: '#/components/schemas/TaskTickRequest'
      responses:
        '200':
          description: Work unit recorded; cumulative voucher raised
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not a party to this task, or the declared payee is not the worker
          content:
