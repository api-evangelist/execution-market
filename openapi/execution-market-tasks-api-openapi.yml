      security: []
  /api/v1/tasks/{task_id}/assign/challenge:
    get:
      tags:
      - Tasks
      summary: Assignment Payment Challenge
      description: 'Return the COMPLETE EIP-712 authorization the publisher must sign to assign this task — nonce, expiries and salt already computed by the server, plus the exact `X-Payment-Auth` envelope to send back. Read-only: it assigns nothing.


        This exists because the EIP-3009 nonce is `AuthCaptureEscrow.getHash(paymentInfo)`, a keccak over an ABI-encoded struct: a client that is a language model driving a wallet cannot compute it, and has no clock for the three expiry fields. Served with **200** rather than only as the 402 of `POST /tasks/{task_id}/assign` because a client that auto-pays 402s may mistake an `escrow` challenge for a plain `exact` one and pay the worker directly, with no escrow.


        Verify before signing: every field is recomputable — see `accepts[0].extra.verify_before_signing`.'
      operationId: get_assign_challenge_api_v1_tasks__task_id__assign_challenge_get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the task
          title: Task Id
        description: UUID of the task
      - name: executor_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the executor you intend to assign
          title: Executor Id
        description: UUID of the executor you intend to assign
      responses:
        '200':
          description: The signable escrow challenge for this assignment
          content:
            application/json:
              schema: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the publisher of this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task or executor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Task not assignable, or not payable by the escrow rail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/{task_id}/assign:
    post:
      tags:
      - Tasks
      summary: Assign Task to Worker
      description: Assign a published task to a specific worker executor
      operationId: assign_task_to_worker_api_v1_tasks__task_id__assign_post
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          description: UUID of the task
          title: Task Id
        description: UUID of the task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkerAssignRequest'
      responses:
        '200':
          description: Task successfully assigned to worker
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Unauthorized - invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to assign this task or worker ineligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Task or executor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Task not assignable in current status. Or, on the Solana rail, `WORKER_USDC_ATA_MISSING` — the worker''s payout address holds no USDC token account, so the channel program''s `distribute` would send its 87% to the program treasury *without reverting* and the worker would read as paid having received nothing. The body carries `worker_payout_address`, `worker_usdc_ata` (the exact account to create), `usdc_mint` and a `spl-token create-account` command; `retryable: true` once that account exists.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`WORKER_USDC_ATA_UNVERIFIABLE` — Solana could not be read, so EM cannot tell whether the worker can receive USDC. The assignment fails CLOSED rather than proceeding on an unanswered question. Carries `Retry-After`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tasks/batch:
    post:
      tags:
      - Tasks
