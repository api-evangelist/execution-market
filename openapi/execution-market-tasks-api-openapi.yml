    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CancelRequest:
      properties:
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
          description: Optional reason for cancellation
      additionalProperties: false
      type: object
      title: CancelRequest
      description: Request model for cancelling a task.
    ExecutorReputation:
      properties:
        effective_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Effective Reputation Score
          description: COALESCE(onchain_reputation_score, reputation_score), 0-100 — the score every min_reputation gate and the leaderboard use. Null means unrated, not zero.
        onchain_reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Onchain Reputation Score
          description: ERC-8004 aggregate cached by the reputation reconciler (0-100). Null when the executor has no on-chain identity or is not yet reconciled.
        reputation_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Reputation Score
          description: Mutable DB heuristic (0-100)
        tasks_completed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Tasks Completed
          description: Number of completed tasks
        avg_rating:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Rating
          description: Average rating received as a worker, 0-5 scale — NOT the 0-100 scores above; never convert one into the other
      type: object
      title: ExecutorReputation
      description: 'What this task''s assigned EXECUTOR has received as a worker.


        The mirror of :class:`PublisherReputation` for the other party, read from

        the same ``executors`` columns the leaderboard ranks by. Nested for the

        same reason: no executor, or a lookup that could not be read, is ONE whole

        ``null`` — never a row of zeros.


        Inside the object a ``null`` score is also an absence: since migration 203

        an executor nobody has rated reads ``effective_reputation_score = NULL``,

        and that means "unrated", not "rated 0".'
    GeoMatchMode:
      type: string
      enum:
      - strict
      - city
      - region
      - country
      - any
      title: GeoMatchMode
      description: "How strictly a worker's location must match the task location.\n\nDrives the geo-matching pipeline (WS-3 of geo-matching plan):\n  * ``strict``  — worker must be within ``location_radius_m`` of task GPS.\n  * ``city``    — worker's resolved city must match the task's city.\n  * ``region``  — worker's region/state must match.\n  * ``country`` — worker's country must match.\n  * ``any``     — no location matching (default when not set)."
    BatchCreateRequest:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/BatchTaskDefinition'
          type: array
          maxItems: 50
          minItems: 1
          title: Tasks
          description: List of tasks to create
        payment_token:
          type: string
          title: Payment Token
          description: Payment token for all tasks
          default: USDC
      additionalProperties: false
      type: object
      required:
      - tasks
      title: BatchCreateRequest
      description: Request model for batch task creation.
    PublisherReputation:
      properties:
        avg_score:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Avg Score
          description: Average score 0-100 received as a publisher
        rating_count:
          type: integer
          minimum: 1.0
          title: Rating Count
          description: How many ratings back that average (always >= 1)
        rater_count:
          type: integer
          minimum: 0.0
          title: Rater Count
          description: How many DISTINCT workers rated this publisher
        signed_count:
          type: integer
          minimum: 0.0
          title: Signed Count
          description: How many of them are authored on-chain by the rater itself (EIP-7702 signed rail) rather than relayed under our key
        last_rated_at:
          type: string
          format: date-time
          title: Last Rated At
          description: Timestamp of the most recent rating (ISO 8601)
        executor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Executor Id
          description: 'The publisher''s executor row, when it has one. NULL is normal: 3 publishers holding 8.9% of all opinions — including the #1 by volume — have no executors row at all.'
      type: object
      required:
      - avg_score
      - rating_count
      - rater_count
      - signed_count
      - last_rated_at
      title: PublisherReputation
      description: 'What this task''s PUBLISHER received from the workers it hired.


        A nested object on purpose, never loose floats on ``TaskResponse``: the

        absence of ratings is ONE whole ``null``, not a score of 0 with a count of

        0. Migration 205 enforces the same thing in the schema — the row exists if

        and only if ``rating_count > 0`` — so a field of this model can never be

        the fabricated zero of INC-2026-08-26.


        Scale is **0-100**, the same as ``effective_reputation_score`` (the source

        is ``feedback_documents.score``). It is NOT the 0-5 ``avg_rating`` of the

        other direction, and the two must never be merged or converted into each

        other: ``score / 20`` would be a third formula nobody agreed to.


        This is the **breakdown**, not a rival score: ``onchain_reputation_score``

        already counts these opinions, mixed in with the ones the same wallet got

        as a worker. Surfaces must label it as such.'
    TaskListResponse:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/TaskResponse'
          type: array
          title: Tasks
          description: List of task objects
        total:
          type: integer
          title: Total
          description: Total number of matching tasks
        count:
          type: integer
          title: Count
          description: Number of tasks in this page
        offset:
          type: integer
          title: Offset
          description: Current pagination offset
        has_more:
          type: boolean
          title: Has More
          description: Whether more results are available
      type: object
      required:
      - tasks
      - total
      - count
      - offset
      - has_more
      title: TaskListResponse
      description: Response model for paginated task list.
    AvailableTasksResponse:
      properties:
        tasks:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Tasks
          description: List of published tasks available for workers
        count:
          type: integer
          title: Count
          description: Number of tasks returned
        offset:
          type: integer
          title: Offset
          description: Current pagination offset
        filters_applied:
          additionalProperties: true
          type: object
          title: Filters Applied
          description: Filters that were applied to this query
      type: object
      required:
      - tasks
      - count
      - offset
      - filters_applied
      title: AvailableTasksResponse
      description: Response model for available tasks (worker view).
    TaskTransactionsResponse:
      properties:
        task_id:
          type: string
          title: Task Id
          description: Task UUID
        transactions:
          items:
            $ref: '#/components/schemas/TransactionEventResponse'
          type: array
          title: Transactions
          description: Chronological list of transaction events
        total_count:
          type: integer
          title: Total Count
          description: Total number of events
        summary:
          additionalProperties: true
          type: object
          title: Summary
          description: 'Summary: total_locked, total_released, total_refunded, fee_collected'
      type: object
      required:
      - task_id
      - transactions
      - total_count
      - summary
      title: TaskTransactionsResponse
      description: Chronological transaction history for a task from the payment_events audit trail.
    SettleTaskChannelRequest:
      properties:
        channel_id:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          title: Channel Id
          description: Channel to settle (base58). Must be the one bound to this task.
        cumulative_uusdc:
          type: integer
          minimum: 1.0
          title: Cumulative Uusdc
          description: Total the voucher commits, in micro-USDC, counted from the channel open — cumulative, not incremental. Must exceed what is already settled on chain and must not exceed the deposit.
        expires_at:
          type: integer
          minimum: 1.0
          title: Expires At
          description: Unix seconds after which the voucher is void. The program enforces it when the transaction lands, so leave real margin (an hour); EM refuses anything expiring within 60 seconds.
        signature:
          type: string
          pattern: ^[1-9A-HJ-NP-Za-km-z]{64,100}$
          title: Signature
          description: 'Base58 of the 64-byte raw ed25519 signature of the session key over voucher_message_bytes(channel_id, cumulative_uusdc, expires_at) — 50 bytes: magic 0x5601 | channelId(32) | u64 LE | i64 LE. Not the JSON, no personal_sign prefix, not base64.'
        session_pubkey:
          anyOf:
          - type: string
            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
          - type: 'null'
          title: Session Pubkey
          description: Optional. The key you signed with. Only ever CHECKED against the channel's on-chain authorized signer, so a mismatch reports itself instead of arriving as a bare 'invalid signature'.
      additionalProperties: false
      type: object
      required:
      - channel_id
      - cumulative_uusdc
      - expires_at
      - signature
      title: SettleTaskChannelRequest
      description: 'The payer''s cumulative voucher, so EM can liquidate a channel on chain.


        This is the escape hatch for a channel whose pay.sh session died: the

        channel is still open, the deposit is still in it, and nothing off-chain can

        move it any more. What CAN move it is the payer''s own signature — the

        program credits the payee only against an ed25519 instruction verifying

        ``channel.authorized_signer`` over ``voucher(channel, cumulative,

        expires_at)``, and neither ``settle`` nor ``distribute`` takes a signer

        account. So the payer signs, EM broadcasts, and EM''s key authorises nothing

        beyond paying the network fee.


        There is deliberately NO field for the split: the distribution is committed

        on chain at ``open`` (``channel.distribution_hash``) and is immutable, so

        offering it here would be offering a choice that does not exist.'
    TaskCategory:
      type: string
      enum:
      - physical_presence
      - knowledge_access
      - human_authority
      - simple_action
      - digital_physical
      - location_based
      - verification
      - social_proof
      - data_collection
      - sensory
      - social
      - proxy
      - bureaucratic
      - emergency
      - creative
      - data_processing
      - api_integration
      - content_generation
      - code_execution
      - research
      - multi_step_workflow
      title: TaskCategory
      description: Categories of tasks that executors can complete.
    WorkerAssignRequest:
      properties:
        executor_id:
          type: string
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          title: Executor Id
          description: Worker's executor ID
        escrow_tx:
          anyOf:
          - type: string
          - type: 'null'
          title: Escrow Tx
          description: Escrow lock transaction hash from AdvancedEscrowClient.authorize(). Proves funds are locked on-chain before assignment.
        payment_info:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Payment Info
          description: 'Serialized PaymentInfo from AdvancedEscrowClient.authorize(). Required when escrow_tx is provided so the server can release escrow at approval time. Must include: operator, receiver, token, max_amount, pre_approval_expiry, authorization_expiry, refund_expiry, min_fee_bps, max_fee_bps, fee_receiver, salt.'
        notes:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Notes
          description: Optional assignment notes for the worker
      additionalProperties: false
      type: object
      required:
      - executor_id
      title: WorkerAssignRequest
      description: Request model for assigning a task to a worker.
  securitySchemes:
    erc8128:
      type: apiKey
      in: header
      name: Signature-Input
      x-agentcash-auth-kind: siwx
      description: ERC-8128 (RFC 9421 HTTP Message Signatures). Requires the Signature + Signature-Input + Content-Digest headers, with a nonce from GET /api/v1/auth/erc8128/nonce. See https://execution.market/skill.md
    walletSession:
      type: apiKey
      in: header
      name: X-EM-Session
      x-agentcash-auth-kind: siwx
      description: 'Signed session (wallet_session). A SessionGrant this server builds at POST /api/v1/auth/session/challenge, signed by the wallet and replayed verbatim. For clients that cannot hash a request body and have no clock. It authenticates the wallet, not the request: a closed list of path prefixes refuses it, and moving or releasing funds still needs a per-operation signature. GET /api/v1/auth/info lists both. Disabled unless EM_WALLET_SESSION_ENABLED is on.'
    oauthBearer:
      type: oauth2
      description: 'OAuth 2.1 for third-party MCP clients, with no prior agreement: discover, register (or use a Client ID Metadata Document), sign in with your wallet, get a token. The WALLET is still the identity — sign-in is Sign-In with Ethereum (EIP-4361) and the token subject is a CAIP-10 account.


        Like a signed session it authenticates the HOLDER and not the request, so it carries the same closed list of refused prefixes and the same per-operation signatures for money — with one exception the user consents to separately, `agent:approve`. Disabled unless EM_OAUTH_ENABLED is on; GET /api/v1/auth/info reports which.'
      flows:
        authorizationCode:
          authorizationUrl: https://auth.execution.market/oauth/authorize
          tokenUrl: https://auth.execution.market/oauth/token
          refreshUrl: https://auth.execution.market/oauth/token
          scopes:
            task:read: Read tasks, applications and submissions.
            task:write: Edit a task you published, and assign a worker to it.
            task:cancel: Cancel a task you published.
            worker:apply: Apply to tasks as a worker on your behalf.
            worker:submit: Submit completed work on your behalf. Refused for bearer tokens in v1.
            worker:withdraw: Withdraw your earnings. Refused for bearer tokens.
            agent:publish: Publish tasks and service listings as you.
            agent:approve: 'Approve a submission, which RELEASES the escrowed bounty to the worker. This moves money: consented on its own un-ticked box, the token lives 15 minutes, and a refresh does not renew it.'
            reputation:rate: 'Rate a counterparty. Refused for bearer tokens: a rating is an act of its author.'
      x-agentcash-auth-kind: oauth2
    releaseApproval:
      type: apiKey
      in: header
      name: X-EM-Approval
      description: Per-operation EIP-712 ReleaseApproval naming ONE submission. Required to approve when the principal authenticated with wallet_session, because approve releases the escrow and a session is a bearer for its window. Build it at GET /api/v1/submissions/{submission_id}/approve/challenge.
    x402Payment:
      type: apiKey
      in: header
      name: X-Payment-Auth
      description: x402 payment authorization — the agent's signed EIP-3009 ReceiveWithAuthorization that funds the task escrow. Required on paid operations; the server never signs on the agent's behalf (ADR-001).
