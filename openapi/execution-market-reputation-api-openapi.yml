      required:
      - prepare_id
      - contract_address
      - chain_id
      - agent_id
      - value
      - tag1
      - tag2
      - endpoint
      - feedback_uri
      - feedback_hash
      title: PrepareFeedbackResponse
      description: Response with parameters for giveFeedback() on-chain call.
    RegistrationStatusResponse:
      properties:
        registration_id:
          type: string
          title: Registration Id
        status:
          type: string
          title: Status
          description: pending | completed | failed
        wallet:
          type: string
          title: Wallet
        network:
          type: string
          title: Network
        agent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Agent Id
          description: ERC-8004 agent ID once resolved
        transaction:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction
          description: Mint tx hash if the facilitator's reply landed
        requested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested At
        resolved_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolved At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        poll:
          anyOf:
          - type: string
          - type: 'null'
          title: Poll
          description: Poll this URL while status is pending
      type: object
      required:
      - registration_id
      - status
      - wallet
      - network
      title: RegistrationStatusResponse
      description: Status of an async (202) registration job.
    RelayPrepareResponse:
      properties:
        digest:
          type: string
          title: Digest
          description: 'The hash the Facilitator verifies against. It ALREADY carries the EIP-191 envelope, so it must be signed as a RAW prehash — running personal_sign over it applies a second envelope and the signature silently fails. Browser wallets cannot sign a raw prehash: use `signing_payload` instead.'
        typed_data:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Typed Data
          description: 'EIP-712 typed data, present once this network runs a v4 delegate. PREFER THIS: `signTypedData` has no envelope to apply twice, which is the failure mode `signing_payload` exists to work around, and the wallet shows the rater the score, agent and deadline as named fields instead of a hex blob.'
        signing_payload:
          anyOf:
          - type: string
          - type: 'null'
          title: Signing Payload
          description: 'SIGN THIS ONE from a browser wallet: personal_sign/`signMessage` over these 32 bytes lands exactly on `digest`. Null when we could not rebuild it — never a guess, because a payload that does not verify produces a failure the caller cannot diagnose.'
        deadline:
          type: integer
          title: Deadline
        nonce:
          type: string
          title: Nonce
        delegated:
          type: boolean
          title: Delegated
          description: False = first rating on this chain; also send an EIP-7702 authorization on submit, built with account_nonce.
        delegate:
          anyOf:
          - type: string
          - type: 'null'
          title: Delegate
        account_nonce:
          anyOf:
          - type: integer
          - type: 'null'
          title: Account Nonce
        chain_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Chain Id
        network:
          type: string
          title: Network
        rater_role:
          type: string
          title: Rater Role
        ratee_role:
          type: string
          title: Ratee Role
        rater_wallet:
          type: string
          title: Rater Wallet
        ratee_agent_id:
          type: integer
          title: Ratee Agent Id
        tag1:
          type: string
          title: Tag1
        tag2:
          type: string
          title: Tag2
        endpoint:
          type: string
          title: Endpoint
        feedback_uri:
          type: string
          title: Feedback Uri
        feedback_hash:
          type: string
          title: Feedback Hash
        reputation_network_requested:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Requested
          description: 'The chain this rating was SUPPOSED to land on: the ratee''s explicit choice if they made one, otherwise the task''s payment chain. The payment-chain default applies to every network, not just Solana — an arbitrum-paid task with no choice now seals on arbitrum, where before 2026-09-10 it sealed on base.'
        reputation_network_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Used
          description: The chain `network` resolved to — the one the digest is bound to. Sign against this one.
        reputation_network_fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Fallback Reason
          description: 'Why the rating changed chain, or null when it did not: `no_identity_on_chain` (the ratee holds no ERC-8004 identity there and one could not be minted), `chain_not_capable`, `chain_guard`, `pref_disabled`.'
      type: object
      required:
      - digest
      - deadline
      - nonce
      - delegated
      - network
      - rater_role
      - ratee_role
      - rater_wallet
      - ratee_agent_id
      - tag1
      - tag2
      - endpoint
      - feedback_uri
      - feedback_hash
      title: RelayPrepareResponse
      description: Everything the wallet needs, plus what submit must echo back verbatim.
    RatedStatusRequest:
      properties:
        task_ids:
          items:
            type: string
          type: array
          maxItems: 500
          minItems: 1
          title: Task Ids
          description: Task ids to check. Max 500 per call.
      type: object
      required:
      - task_ids
      title: RatedStatusRequest
      description: Which of these tasks already carry a rating, and in which direction.
    OwedRatingsResponse:
      properties:
        executor_id:
          type: string
          title: Executor Id
        owed:
          items:
            $ref: '#/components/schemas/OwedRatingItem'
          type: array
          title: Owed
        count:
          type: integer
          title: Count
      type: object
      required:
      - executor_id
      - owed
      - count
      title: OwedRatingsResponse
    RegisterAgentResponse:
      properties:
        success:
          type: boolean
          title: Success
        agent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Agent Id
          description: Newly assigned ERC-8004 agent ID
        transaction:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction
          description: Registration tx hash
        transfer_transaction:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfer Transaction
          description: NFT transfer tx hash (if recipient specified)
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
        network:
          type: string
          title: Network
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Human-readable note (e.g. identity already existed, no mint)
      type: object
      required:
      - success
      - network
      title: RegisterAgentResponse
      description: Response from agent registration.
    ConfirmFeedbackRequest:
      properties:
        prepare_id:
          type: string
          title: Prepare Id
          description: prepare_id from prepare-feedback
        tx_hash:
          type: string
          maxLength: 66
          minLength: 66
          title: Tx Hash
          description: 0x-prefixed TX hash
        task_id:
          type: string
          maxLength: 36
          minLength: 36
          title: Task Id
          description: Task ID for context
      type: object
      required:
      - prepare_id
      - tx_hash
      - task_id
      title: ConfirmFeedbackRequest
      description: Request to confirm that the worker signed the feedback TX.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    CrossChainReputationResponse:
      properties:
        wallet_address:
          type: string
          title: Wallet Address
        final_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Final Score
          description: describe.net's global_score (mean of per-chain means, 0-100). NULL = no eligible ratings in the index, or this wallet was never reconciled — NEVER 0. Read retrieved_at to tell the two apart.
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          description: '''describenet'' when a score is served. NULL when there is none. There is no third value: EM never authors this number.'
        policy_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Policy Version
          description: Provider policy that produced the score. Scores under different policy versions are not comparable.
        refreshed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Refreshed At
          description: When the PROVIDER's materialized view was refreshed (index freshness). NULL = not recorded, never 'just now'.
        retrieved_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Retrieved At
          description: When EM fetched the snapshot — the AGE every surface must display next to the score. NULL = never reconciled.
        chain_count:
          type: integer
          title: Chain Count
          description: Chains that contributed a score (len(per_chain))
        total_reviews:
          type: integer
          title: Total Reviews
          description: Eligible reviews across all chains, as reported by describe.net
        chains_with_identity:
          type: integer
          title: Chains With Identity
          description: Chains where the index sees at least one ERC-8004 identity
        chains_skipped:
          type: integer
          title: Chains Skipped
          description: Chains with identity but no eligible ratings (excluded from per_chain — absence, not a 0)
        per_chain:
          additionalProperties:
            $ref: '#/components/schemas/CrossChainPerChain'
          type: object
          title: Per Chain
          description: 'Per-chain breakdown, scored chains only: {network: {agent_ids, average, review_count, distinct_raters}}'
        per_chain_retrieved_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Per Chain Retrieved At
          description: Age of the BREAKDOWN specifically. Normally identical to retrieved_at (both come from one reconciler fetch); it can lag by a cycle when the best-effort snapshot insert failed after the aggregate was already mirrored. Disclosed instead of hidden.
      type: object
      required:
      - wallet_address
      - chain_count
      - total_reviews
      - chains_with_identity
      - chains_skipped
      title: CrossChainReputationResponse
      description: 'A wallet''s multi-chain reputation as describe.net computed it.


        Every number below is served from EM''s snapshot of the provider''s answer.

        EM aggregates nothing here.'
    RatedStatusResponse:
      properties:
        rated:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Rated
          description: task_id -> directions already rated. A direction is listed only when its on-chain tx is persisted; a row without a tx means the write failed or is pending and the task is still rateable.
        unknown:
          items:
            type: string
          type: array
          title: Unknown
          description: Task ids with no rating record at all — safe to rate.
      type: object
      required:
      - rated
      title: RatedStatusResponse
    ERC8004InfoResponse:
      properties:
        available:
          type: boolean
          title: Available
        network:
          type: string
          title: Network
        facilitator_url:
          type: string
          title: Facilitator Url
        em_agent_id:
          type: integer
          title: Em Agent Id
        contracts:
          additionalProperties:
            type: string
          type: object
          title: Contracts
      type: object
      required:
      - available
      - network
      - facilitator_url
      - em_agent_id
      - contracts
      title: ERC8004InfoResponse
      description: ERC-8004 integration status and info.
    ReputationResponse:
      properties:
        agent_id:
          type: integer
          title: Agent Id
        count:
          type: integer
          title: Count
        score:
          type: number
          title: Score
          description: Reputation score (0-100)
        network:
          type: string
          title: Network
      type: object
      required:
      - agent_id
      - count
      - score
      - network
      title: ReputationResponse
      description: Reputation summary for an agent.
    AgentFeedbackRequest:
      properties:
        score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Score
          description: Rating score from 0 (worst) to 100 (best)
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
          description: Optional comment about the interaction
        proof_tx:
          anyOf:
          - type: string
          - type: 'null'
          title: Proof Tx
          description: Transaction hash of payment (for verified feedback)
        agent_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Agent Id
          description: Agent's ERC-8004 token ID. Omit for H2H/KK tasks — the publisher's identity is resolved from the task.
        task_id:
          type: string
          maxLength: 36
          minLength: 36
          title: Task Id
          description: Task ID for context
      type: object
      required:
      - score
      - task_id
      title: AgentFeedbackRequest
      description: Request for a worker to rate an agent.
  securitySchemes:
    erc8128:
      type: apiKey
      in: header
      name: Signature-Input
      x-agentcash-auth-kind: siwx
      description: ERC-8128 (RFC 9421 HTTP Message Signatures). Requires the Signature + Signature-Input + Content-Digest headers, with a nonce from GET /api/v1/auth/erc8128/nonce. See https://execution.market/skill.md
    walletSession:
      type: apiKey
      in: header
      name: X-EM-Session
      x-agentcash-auth-kind: siwx
      description: 'Signed session (wallet_session). A SessionGrant this server builds at POST /api/v1/auth/session/challenge, signed by the wallet and replayed verbatim. For clients that cannot hash a request body and have no clock. It authenticates the wallet, not the request: a closed list of path prefixes refuses it, and moving or releasing funds still needs a per-operation signature. GET /api/v1/auth/info lists both. Disabled unless EM_WALLET_SESSION_ENABLED is on.'
    oauthBearer:
      type: oauth2
      description: 'OAuth 2.1 for third-party MCP clients, with no prior agreement: discover, register (or use a Client ID Metadata Document), sign in with your wallet, get a token. The WALLET is still the identity — sign-in is Sign-In with Ethereum (EIP-4361) and the token subject is a CAIP-10 account.


        Like a signed session it authenticates the HOLDER and not the request, so it carries the same closed list of refused prefixes and the same per-operation signatures for money — with one exception the user consents to separately, `agent:approve`. Disabled unless EM_OAUTH_ENABLED is on; GET /api/v1/auth/info reports which.'
      flows:
        authorizationCode:
          authorizationUrl: https://auth.execution.market/oauth/authorize
          tokenUrl: https://auth.execution.market/oauth/token
          refreshUrl: https://auth.execution.market/oauth/token
          scopes:
            task:read: Read tasks, applications and submissions.
            task:write: Edit a task you published, and assign a worker to it.
            task:cancel: Cancel a task you published.
            worker:apply: Apply to tasks as a worker on your behalf.
            worker:submit: Submit completed work on your behalf. Refused for bearer tokens in v1.
            worker:withdraw: Withdraw your earnings. Refused for bearer tokens.
            agent:publish: Publish tasks and service listings as you.
            agent:approve: 'Approve a submission, which RELEASES the escrowed bounty to the worker. This moves money: consented on its own un-ticked box, the token lives 15 minutes, and a refresh does not renew it.'
            reputation:rate: 'Rate a counterparty. Refused for bearer tokens: a rating is an act of its author.'
      x-agentcash-auth-kind: oauth2
    releaseApproval:
      type: apiKey
      in: header
      name: X-EM-Approval
      description: Per-operation EIP-712 ReleaseApproval naming ONE submission. Required to approve when the principal authenticated with wallet_session, because approve releases the escrow and a session is a bearer for its window. Build it at GET /api/v1/submissions/{submission_id}/approve/challenge.
    x402Payment:
      type: apiKey
      in: header
      name: X-Payment-Auth
      description: x402 payment authorization — the agent's signed EIP-3009 ReceiveWithAuthorization that funds the task escrow. Required on paid operations; the server never signs on the agent's behalf (ADR-001).
