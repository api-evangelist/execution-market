      - loc
      - msg
      - type
      title: ValidationError
    OwedRatingItem:
      properties:
        task_id:
          type: string
          title: Task Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        publisher_wallet:
          anyOf:
          - type: string
          - type: 'null'
          title: Publisher Wallet
          description: task.agent_id — the publisher this worker still owes a rating
        publisher_agent_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Publisher Agent Id
          description: task.erc8004_agent_id if already known
        bounty_usd:
          anyOf:
          - type: number
          - type: 'null'
          title: Bounty Usd
        completed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Completed At
      type: object
      required:
      - task_id
      title: OwedRatingItem
    CrossChainPerChain:
      properties:
        agent_ids:
          items:
            type: string
          type: array
          title: Agent Ids
          description: 'ERC-8004 ids this wallet owns on the chain (strings: ids are per-chain and not always numeric)'
        average:
          type: number
          title: Average
          description: describe.net's final_score for this chain (0-100). Never EM-computed.
        review_count:
          type: integer
          title: Review Count
          description: Eligible reviews counted on this chain
        distinct_raters:
          type: integer
          title: Distinct Raters
          description: Distinct raters behind review_count
      type: object
      required:
      - average
      - review_count
      - distinct_raters
      title: CrossChainPerChain
      description: 'One chain of describe.net''s breakdown, verbatim from the snapshot.


        Only chains that carry a real score appear in ``per_chain``. A chain with

        an identity but no eligible ratings has ``final_score: null`` upstream and

        is counted in ``chains_skipped`` instead of being rendered as a 0.'
    PublisherReputationResponse:
      properties:
        publisher_key:
          type: string
          title: Publisher Key
          description: 'Canonical publisher identity: lower(COALESCE(NULLIF(tasks.human_wallet,''''), tasks.agent_id)). Echoed back normalised, so a caller can tell which key answered.'
        avg_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Score
          description: Average score 0-100. Null = no ratings, never 0.
        rating_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rating Count
          description: How many ratings back the average. Null = no ratings.
        rater_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Rater Count
          description: Distinct workers who rated this publisher.
        signed_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Signed Count
          description: How many are authored on-chain by the rater itself (EIP-7702 signed rail) rather than relayed under our key.
        last_rated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Rated At
          description: Timestamp of the most recent rating.
        executor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Executor Id
          description: 'The publisher''s executors row when it has one. Null is normal: 3 publishers holding 8.9% of all opinions — including the #1 by volume — have no executors row.'
      type: object
      required:
      - publisher_key
      title: PublisherReputationResponse
      description: 'What a PUBLISHER received from the workers it hired (migration 205).


        Flat, not a wrapper: here the key IS the subject, so a caller that asked

        about one publisher reads ``avg_score`` directly. When that publisher has

        no ratings every field except ``publisher_key`` is ``null`` — HTTP 200,

        never 404, and **never a zero**. A 0 on a 0-100 scale reads as "the worst

        publisher on the market", which is not a claim we can make about someone

        nobody has rated (INC-2026-08-26).'
    MetadataEntry:
      properties:
        key:
          type: string
          maxLength: 64
          minLength: 1
          title: Key
        value:
          type: string
          maxLength: 256
          minLength: 1
          title: Value
      type: object
      required:
      - key
      - value
      title: MetadataEntry
      description: Key-value metadata for agent registration.
    WorkerFeedbackRequest:
      properties:
        score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Score
          description: Rating score from 0 (worst) to 100 (best)
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
          description: Optional comment about the interaction
        proof_tx:
          anyOf:
          - type: string
          - type: 'null'
          title: Proof Tx
          description: Transaction hash of payment (for verified feedback)
        task_id:
          type: string
          maxLength: 36
          minLength: 36
          title: Task Id
          description: Task ID for context
        worker_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Worker Address
          description: Worker's wallet address
      type: object
      required:
      - score
      - task_id
      title: WorkerFeedbackRequest
      description: Request to rate a worker after task completion.
    RelaySubmitRequest:
      properties:
        task_id:
          type: string
          maxLength: 36
          minLength: 36
          title: Task Id
        direction:
          type: string
          title: Direction
        score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Score
        network:
          type: string
          title: Network
        ratee_agent_id:
          type: integer
          title: Ratee Agent Id
        rater_wallet:
          type: string
          title: Rater Wallet
        deadline:
          type: integer
          title: Deadline
        nonce:
          type: string
          title: Nonce
        signature:
          type: string
          maxLength: 132
          minLength: 132
          title: Signature
        authorization:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Authorization
          description: EIP-7702 authorization; required only when prepare said delegated=false.
        tag1:
          type: string
          title: Tag1
          default: ''
        tag2:
          type: string
          title: Tag2
          default: ''
        endpoint:
          type: string
          title: Endpoint
          default: ''
        feedback_uri:
          type: string
          title: Feedback Uri
          default: ''
        feedback_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback Hash
      type: object
      required:
      - task_id
      - direction
      - score
      - network
      - ratee_agent_id
      - rater_wallet
      - deadline
      - nonce
      - signature
      title: RelaySubmitRequest
      description: Relay the signed rating. The on-chain author is the rater.
    FeedbackResponse:
      properties:
        success:
          type: boolean
          title: Success
        transaction_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Hash
        feedback_index:
          anyOf:
          - type: integer
          - type: 'null'
          title: Feedback Index
        network:
          type: string
          title: Network
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        reputation_network_requested:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Requested
          description: 'The chain this rating was SUPPOSED to land on: the ratee''s explicit choice if they made one, otherwise the task''s payment chain. The payment-chain default applies to every network, not just Solana — an arbitrum-paid task with no choice now seals on arbitrum, where before 2026-09-10 it sealed on base.'
        reputation_network_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Used
          description: The chain it actually landed on. Equal to `reputation_network_requested` unless something forced a change — in which case `reputation_network_fallback_reason` says what.
        reputation_network_fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Fallback Reason
          description: 'Why the rating changed chain, or null when it did not: `no_identity_on_chain` (the ratee holds no ERC-8004 identity there and one could not be minted), `chain_not_capable` (the chain cannot carry ERC-8004 reputation we can author), `chain_guard` (the agent id we hold lives on another chain and ids are per-chain), `pref_disabled` (cross-chain reputation is switched off). Until 2026-09-10 this was silent: 18 ratings of Solana-paid work sealed on Base and every response said only `success: true`.'
      type: object
      required:
      - success
      - network
      title: FeedbackResponse
      description: Response after submitting feedback.
    PrepareFeedbackRequest:
      properties:
        agent_id:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Agent Id
          description: Target agent's ERC-8004 token ID. Omit for H2H tasks — the human publisher's identity is resolved from the task.
        task_id:
          type: string
          maxLength: 36
          minLength: 36
          title: Task Id
          description: Task ID for context
        score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Score
          description: Rating score from 0 (worst) to 100 (best)
        comment:
          anyOf:
          - type: string
            maxLength: 1000
          - type: 'null'
          title: Comment
          description: Optional comment about the interaction
        worker_address:
          anyOf:
          - type: string
            maxLength: 42
            minLength: 42
          - type: 'null'
          title: Worker Address
          description: Worker's wallet address. Omit to resolve it server-side from the task's assigned executor (else the authenticated caller's wallet). An explicit value is still validated against the assignment.
      type: object
      required:
      - task_id
      - score
      title: PrepareFeedbackRequest
      description: Request to prepare on-chain feedback parameters for worker signing.
    RelayPrepareRequest:
      properties:
        task_id:
          type: string
          maxLength: 36
          minLength: 36
          title: Task Id
        direction:
          type: string
          title: Direction
          description: publisher_rates_executor | executor_rates_publisher. The role NAMES (buyer/seller vs requester/executor) are resolved from the task.
        score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Score
        comment:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Comment
      type: object
      required:
      - task_id
      - direction
      - score
      title: RelayPrepareRequest
      description: Ask what this rater must sign to author a rating.
    ConfirmFeedbackResponse:
      properties:
        success:
          type: boolean
          title: Success
        transaction_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Transaction Hash
        network:
          type: string
          title: Network
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        reputation_network_requested:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Requested
          description: ALWAYS null on this endpoint. The chain was chosen at /reputation/prepare-feedback and that decision is not re-derivable here, so this reports nothing rather than repeating `reputation_network_used` back at you — a placeholder would occupy the place of the proof. Read it off the prepare response, which is also the one you signed against. Null means NOT RECORDED HERE, never 'nothing moved'.
        reputation_network_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Used
          description: The chain the confirmed transaction was signed for, read from the stored feedback document. This endpoint used to answer a constant instead, so a cross-chain rating confirmed as `base` while its tx lived somewhere else.
        reputation_network_fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Fallback Reason
          description: 'ALWAYS null on this endpoint, for the same reason as `reputation_network_requested`: the fallback, if there was one, was decided and reported at prepare time.'
      type: object
      required:
      - success
      - network
      title: ConfirmFeedbackResponse
      description: Response after confirming feedback TX.
    RegisterAgentRequest:
