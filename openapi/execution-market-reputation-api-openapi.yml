        network:
          type: string
          title: Network
          description: ERC-8004 network for registration
          default: base
        agent_uri:
          type: string
          maxLength: 2048
          minLength: 1
          title: Agent Uri
          description: URI to agent registration file (IPFS or HTTPS)
        metadata:
          anyOf:
          - items:
              $ref: '#/components/schemas/MetadataEntry'
            type: array
          - type: 'null'
          title: Metadata
          description: Optional key-value metadata pairs
        recipient:
          anyOf:
          - type: string
            pattern: ^0x[0-9a-fA-F]{40}$
          - type: 'null'
          title: Recipient
          description: Optional address to receive the NFT after minting
      type: object
      required:
      - agent_uri
      title: RegisterAgentRequest
      description: Request to register a new agent on ERC-8004 (gasless).
    PrepareFeedbackResponse:
      properties:
        prepare_id:
          type: string
          title: Prepare Id
          description: Unique ID to confirm feedback later
        contract_address:
          type: string
          title: Contract Address
        chain_id:
          type: integer
          title: Chain Id
        agent_id:
          type: integer
          title: Agent Id
        value:
          type: integer
          title: Value
        value_decimals:
          type: integer
          title: Value Decimals
          default: 0
        tag1:
          type: string
          title: Tag1
        tag2:
          type: string
          title: Tag2
        endpoint:
          type: string
          title: Endpoint
        feedback_uri:
          type: string
          title: Feedback Uri
        feedback_hash:
          type: string
          title: Feedback Hash
          description: 0x-prefixed keccak256 hex
        estimated_gas:
          type: integer
          title: Estimated Gas
          default: 200000
        reputation_network_requested:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Requested
          description: 'The chain this rating was SUPPOSED to land on: the ratee''s explicit choice if they made one, otherwise the task''s payment chain. The payment-chain default applies to every network, not just Solana — an arbitrum-paid task with no choice now seals on arbitrum, where before 2026-09-10 it sealed on base.'
        reputation_network_used:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Used
          description: The chain it actually landed on. Equal to `reputation_network_requested` unless something forced a change — in which case `reputation_network_fallback_reason` says what.
        reputation_network_fallback_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reputation Network Fallback Reason
          description: 'Why the rating changed chain, or null when it did not: `no_identity_on_chain` (the ratee holds no ERC-8004 identity there and one could not be minted), `chain_not_capable` (the chain cannot carry ERC-8004 reputation we can author), `chain_guard` (the agent id we hold lives on another chain and ids are per-chain), `pref_disabled` (cross-chain reputation is switched off). Until 2026-09-10 this was silent: 18 ratings of Solana-paid work sealed on Base and every response said only `success: true`.'
