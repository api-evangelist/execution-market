          - type: string
          - type: 'null'
          title: Agent Wallet
        network:
          type: string
          title: Network
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        image:
          anyOf:
          - type: string
          - type: 'null'
          title: Image
        services:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Services
