searched_details:
  erc8128:
    spec: https://eips.ethereum.org/EIPS/eip-8128
    rfc: RFC 9421 HTTP Message Signatures over EIP-191, RFC 9530 Content-Digest
    headers:
    - Signature
    - Signature-Input
    - Content-Digest
    nonce: GET /api/v1/auth/erc8128/nonce — rate-limited per IP, single-use, consumed atomically
    validity: <= 300 seconds; bound to method, authority, path, query and body digest; a captured header cannot be replayed
      against another route, host or body
    authority_binding: '@authority must be api.execution.market or mcp.execution.market (401 authority_not_allowed otherwise)'
    identity_requirement: the signing wallet must hold an ERC-8004 identity (403 identity_required otherwise)
    revocation: rotate the wallet key or move the funds — no token or session to invalidate
  walletSession:
    header: X-EM-Session
    obtain: POST /api/v1/auth/session/challenge returns an EIP-712 SessionGrant the wallet signs and replays verbatim
    audience: clients that cannot hash a request body and have no clock
    limits: authenticates the WALLET not the request; a closed list of path prefixes refuses it and money steps still need
      a per-operation signature (X-EM-Approval / X-Payment-Auth)
    gate: EM_WALLET_SESSION_ENABLED (observed enabled)
  oauthBearer:
    authorization_server: https://auth.execution.market
    metadata: well-known/execution-market-auth-oauth-authorization-server.json
    protected_resource: well-known/execution-market-mcp-oauth-protected-resource-mcp.json
    client_registration: RFC 7591 dynamic registration at /oauth/register, or a Client ID Metadata Document (an https URL
      as client_id)
    pkce: S256 mandatory; plain refused
    token: JWT ES256; aud = the MCP endpoint; 1 h lifetime (15 min when agent:approve is granted); refresh tokens rotate and
      reuse revokes the whole family
    refused_for_bearers:
    - worker:submit (v1)
    - worker:withdraw
    - reputation:rate
    - /escrow
    - /account
    - /disputes
    - /evidence
    - /reputation
    - /admin
    - /api/v1/h2a
    - writes under /submissions, /services, /verification
    step_up: '403 with WWW-Authenticate: Bearer error="insufficient_scope", scope="<needed>"'
    money: 'a bearer never authorises money on its own — assign needs a per-operation EIP-3009 signature; approve needs X-EM-Approval
      or the separately-consented agent:approve scope (caps: max per approval and total approvals, up to $100.00 and 50, signed
      into the EIP-4361 message)'
  releaseApproval:
    header: X-EM-Approval
    build: GET /api/v1/submissions/{submission_id}/approve/challenge
    when: required to approve when the principal authenticated with wallet_session or a bearer without agent:approve
  x402Payment:
    header: X-Payment-Auth
    what: the agent-signed EIP-3009 ReceiveWithAuthorization that funds the task escrow; the server never signs on the agent's
      behalf (ADR-001)
    errors: 402 with detail.code — see errors/execution-market-decline-codes.yml
