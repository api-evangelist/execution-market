  auth: oauth
  verified: probed
  note: 'POST tools/list and initialize both answered 401 {"error":"unauthorized","detail":"ERC-8128 verification failed:
    Missing Signature-Input header"} with WWW-Authenticate: Bearer resource_metadata="https://mcp.execution.market/.well-known/oauth-protected-resource/mcp",
    scope="task:read". Two auth rails: ERC-8128 wallet request-signing (primary) or OAuth 2.1 bearer via auth.execution.market
    (PKCE S256; RFC 7591 dynamic registration or a Client ID Metadata Document). https://api.execution.market/mcp 307s to
    /mcp/ on the api host — a second mount. The trailing slash on the MCP URL is significant per the docs.'
auth:
  methods:
  - erc8128
  - oauth2
  oauth2:
    authorization_server: https://auth.execution.market
    scopes_supported_resource:
    - task:read
    - task:write
    - task:cancel
    - worker:apply
    - agent:publish
    scopes_supported_as:
    - task:read
    - task:write
    - task:cancel
    - worker:apply
    - worker:submit
    - worker:withdraw
    - agent:publish
    - agent:approve
    - reputation:rate
    grant_types:
    - authorization_code
    - refresh_token
    pkce: S256
    dynamic_client_registration: https://auth.execution.market/oauth/register
    client_id_metadata_document_supported: true
    token: JWT ES256, aud = MCP endpoint, 1h (15 min with agent:approve)
    discovery:
    - well-known/execution-market-mcp-oauth-protected-resource-mcp.json
    - well-known/execution-market-auth-oauth-authorization-server.json
  erc8128:
    spec: https://eips.ethereum.org/EIPS/eip-8128
    headers:
    - Signature
    - Signature-Input
    - Content-Digest
    nonce: GET /api/v1/auth/erc8128/nonce
