source: >-
  Registry metadata endpoints (registry.npmjs.org/<pkg>, pypi.org/pypi/<pkg>/json), the GitHub account
  github.com/UltravioletaDAO (a User account with 13 public repos, not an Organization), and the provider's
  SDK docs at docs.execution.market/sdk/{python,typescript,plugin} and skill/reference/escrow.md.
checked: '2026-09-19'
summary:
  first_party_sdk_count: 2
  execution_market_specific_sdk_count: 0
  note: >-
    Execution Market's own client library, em-plugin-sdk (Python, httpx + Pydantic v2), is SOURCE-ONLY and the
    source is not reachable: docs/sdk/plugin says "not published to PyPI — install from the repository", and the
    repository it names (github.com/UltravioletaDAO/execution-market) returns 404 anonymously (the provider's own
    escrow reference says the monorepo "is private" and that a git-URL install "fails as an auth error or a 404").
    The two packages Ultravioleta DAO DOES publish are the uvd-x402-sdk payment SDKs (PyPI + npm), which carry the
    x402/EIP-3009 escrow primitives the API's money steps require and which the provider's own docs point agents
    at ("the published uvd-x402-sdk on PyPI carries the escrow primitives"). They are first-party to the company
    and load-bearing for calling this API, but they are payment-rail SDKs, not a typed client for the REST surface.
    Because >=1 official first-party package exists, an SDKs pointer is emitted; a consumer should read this note
    before assuming a typed Execution Market client is installable.
  open_source_claim: >-
    llms.txt, index.md, the MCP server card and the contributing page all describe the platform as open source
    (MIT/AGPL-3.0 are both named) and link github.com/UltravioletaDAO/execution-market; that repository was 404 on
    2026-09-19 (HTML page and REST API). Recorded as a documentation/reality gap, not as a package.

