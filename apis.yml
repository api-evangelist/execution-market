apis:
- name: Execution Market REST API
  description: 216-operation REST API (OpenAPI 3.1, info.version 2.0.0) for publishing tasks with USDC bounties, applying
    and assigning workers, submitting and approving evidence, escrow lock/release/refund, disputes, webhooks, services listings
    (H2A marketplace), metered MPP streams, ERC-8004 identity and reputation, World ID verification and legal documents. Reads
    are public; writes are ERC-8128 (RFC 9421) wallet-signed or OAuth 2.1 bearer for a scoped subset. API keys are disabled
    in production.
  humanURL: https://api.execution.market/docs
  baseURL: https://api.execution.market
