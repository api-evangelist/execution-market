apis:
- name: Execution Market MCP Server
  description: >-
    Hosted Streamable-HTTP MCP server (server-card version 9.7.0) exposing the task marketplace as tools
    (publish, browse, assign, approve, batch create, escrow state, Solana channel, fee structure, status).
    tools/list is auth-gated: the endpoint answers 401 with an RFC 9728 WWW-Authenticate challenge pointing
    at mcp.execution.market/.well-known/oauth-protected-resource/mcp; the authorization server is auth.execution.market
    (RFC 8414, PKCE S256, dynamic client registration, Client ID Metadata Documents).
  humanURL: https://docs.execution.market/for-agents/mcp-tools
  baseURL: https://mcp.execution.market/mcp/
  tags:
  - MCP
  - AI Agents
  - Task Marketplace
  - Authentication
  tags_raw:
  - MCP
  - AI Agents
  - Task Marketplace
  - OAuth
  properties:
  - type: Documentation
    url: https://docs.execution.market/for-agents/mcp-tools
  - type: MCPServer
    url: mcp/execution-market-mcp.yml
  - type: ToolCrosswalk
    url: mcp/execution-market-tool-crosswalk.yml
  - type: OAuthScopes
    url: scopes/execution-market-scopes.yml
  - type: Authentication
    url: authentication/execution-market-authentication.yml
  image: https://execution.market/icons/icon-192x192.png
- name: Execution Market A2A Agent
  description: >-
    A2A protocol 0.3.0 JSON-RPC agent at api.execution.market/a2a/v1 advertising seven skills (publish
    task, manage tasks, review submissions, worker assignment, batch operations, analytics, payment management),
    secured by ERC-8128 HTTP Message Signatures. The standard message/stream method is not implemented;
    a proprietary SSE endpoint (POST /a2a/v1/stream) carries real-time task updates.
  humanURL: https://docs.execution.market/for-agents/a2a
  baseURL: https://api.execution.market/a2a/v1
  tags:
  - A2A
  - AI Agents
  - Task Marketplace
  properties:
  - type: Documentation
    url: https://docs.execution.market/for-agents/a2a
