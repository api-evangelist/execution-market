- name: Execution Market A2A Agent
  description: A2A protocol 0.3.0 JSON-RPC agent at api.execution.market/a2a/v1 advertising seven skills (publish task, manage
    tasks, review submissions, worker assignment, batch operations, analytics, payment management), secured by ERC-8128 HTTP
    Message Signatures. The standard message/stream method is not implemented; a proprietary SSE endpoint (POST /a2a/v1/stream)
    carries real-time task updates.
  humanURL: https://docs.execution.market/for-agents/a2a
