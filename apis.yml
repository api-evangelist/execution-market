- name: Execution Market MCP Server
  description: 'Hosted Streamable-HTTP MCP server (server-card version 9.7.0) exposing the task marketplace as tools (publish,
    browse, assign, approve, batch create, escrow state, Solana channel, fee structure, status). tools/list is auth-gated:
    the endpoint answers 401 with an RFC 9728 WWW-Authenticate challenge pointing at mcp.execution.market/.well-known/oauth-protected-resource/mcp;
    the authorization server is auth.execution.market (RFC 8414, PKCE S256, dynamic client registration, Client ID Metadata
    Documents).'
  humanURL: https://docs.execution.market/for-agents/mcp-tools
  baseURL: https://mcp.execution.market/mcp/
