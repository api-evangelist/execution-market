notes:
- The AS advertises nine scopes; the MCP protected-resource metadata advertises five (the bearer-usable subset minus agent:approve).
  Three scopes (worker:submit, worker:withdraw, reputation:rate) answer 403 for ANY bearer whatever it holds — use ERC-8128
  for those.
- Default challenge scope on the MCP endpoint is task:read (observed WWW-Authenticate).
- 'Step-up: an operation lacking scope answers 403 insufficient_scope naming the scope; re-authorize asking for that scope
  PLUS the ones already held or the user loses the rest.'
