  description: 'OAuth 2.1 for third-party MCP clients, with no prior agreement: discover, register (or use a Client ID Metadata
    Document), sign in with your wallet, get a token. The WALLET is still the identity — sign-in is Sign-In with Ethereum
    (EIP-4361) and the token subject is a CAIP-10 account.


    Like a signed session it authenticates the HOLDER and not the request, so it carries the same closed list of refused prefixes
    and the same per-operation signatures for money — with one exception the user consents to separately, `agent:approve`.
    Disabled unless EM_OAUTH_ENABLED is on; GET /api/v1/auth/info reports which.'
