  RFC 9728 protected-resource metadata, all fetched), A2A 0.3.0 (card fetched, graded conformant), MCP Streamable HTTP
  (server card fetched; live endpoint answers an RFC 9728 challenge), RFC 9727 api-catalog (linkset fetched), RFC 9421
  HTTP Message Signatures via ERC-8128 (securityScheme), x402 + EIP-3009 (discovery document fetched), ERC-8004 identity
  and Sign-In with Ethereum (EIP-4361) with CAIP-10 subjects. NOT conformant: RFC 9457 problem details (FastAPI detail
  envelope), OIDC (no openid-configuration), RFC 9116 security.txt (absent), RFC 8594 Sunset. No classic
  sector standard (PCI DSS, ISO 20022, FAPI) is claimed and none applies to a stablecoin escrow marketplace.
