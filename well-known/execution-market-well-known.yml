  document, and an MCP server card. NOT served anywhere: security.txt (RFC 9116 — so NO SecurityTxt pointer), openid-configuration,
  ai-plugin.json, ucp.json, acp.json, aauth-resource.json, apis.json/apis.yml. registration_endpoint is present in the AS
  metadata (dynamic client registration) and client_id_metadata_document_supported is true.'
