settlement_failure_codes:
- code: AUTHORIZATION_EXPIRED
  retryable: false
  http_status: 409
  remediation: 'Escrow authorizationExpiry passed; on-chain release reverts. Funds are not lost: the PAYER reclaims with GET
    /api/v1/escrow/task/{task_id}/reclaim.'
- code: WORKER_WALLET_MISSING
  retryable: false
  http_status: 409
  remediation: Worker has no payout wallet; worker sets it, then approve again.
- code: WORKER_WALLET_INVALID
  retryable: false
  http_status: 409
  remediation: Worker payout wallet malformed; worker fixes it.
- code: SELF_PAYMENT_BLOCKED
  retryable: false
  http_status: 409
  remediation: Receiver == payer (SC-010). Assign a different worker.
- code: PAYMENT_AUTH_MISSING
  retryable: false
  http_status: 409
  remediation: No stored x402 authorization for this task; escrow must be signed.
- code: ESCROW_STATE_MISSING
  retryable: false
  http_status: 409
  remediation: Escrow row without payment_info; needs provider-side repair — quote the ref.
- code: PAYOUT_NON_POSITIVE
  retryable: false
  http_status: 409
  remediation: Computed payout <= 0; check bounty and fee split, quote the ref.
- code: SDK_UNAVAILABLE
  retryable: true
  http_status: 502
  remediation: x402 SDK did not load; retry in a few minutes.
- code: TX_HASH_MISSING
  retryable: true
  http_status: 502
  remediation: Settle answered OK without a tx hash; retry the approval, never record a payment you cannot name.
- code: LIFECYCLE_ORDER_REQUIRED
  retryable: true
  http_status: 409
  remediation: Payer has not signed the release order; GET /api/v1/escrow/task/{task_id}/lifecycle-challenge, sign with the
    wallet that funded the escrow, resend as lifecycle_order.
- code: SETTLEMENT_FAILED
  retryable: true
  http_status: 502
  remediation: Unclassified; retry with backoff and quote the ref if it repeats.
notes:
- A 504 is never emitted by the application; it comes from the load balancer and means timeout — a timed-out mutation is NOT
  a failed mutation, reconcile (signed GET /tasks?publisher=<wallet>) before retrying.
- 'NETWORK_MISMATCH: prefix — X-Payment-Auth signed for a different network than the task; re-sign for task.payment_network.'
- '202 Accepted is not an error: async escrow lock or slow identity mint — poll GET /tasks/{id}, never re-POST (a blind re-POST
  mints a duplicate identity).'
